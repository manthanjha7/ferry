<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <div data-name="Scriptless board" style="padding: 20px; font: 12px/16px monospace">
        <!-- No <script data-dc-script> anywhere in this file. The dc-import
             still has to be inlined, and this placeholder still has to survive
             untouched: resolving the tree against an empty scope would rewrite
             it to "" and the UI would stop warning about a document it cannot
             actually render. -->
        <div data-name="Unresolvable" style="background: #eeeeee">{{ neverResolves }}</div>
        <div data-name="Cell" style="width: 180px">
          <dc-import name="Dcimport Panel" tone="scriptless" hint-size="180px,90px"></dc-import>
        </div>
      </div>
    </x-dc>
  </body>
</html>
