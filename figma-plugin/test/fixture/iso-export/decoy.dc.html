<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Iso decoy</title>
    <!-- Links the sheet that sits beside it, which names the narrow font by a
         path relative to itself. Same string, same size, same family name as
         the panel document: only the file behind the family differs. -->
    <link rel="stylesheet" href="decoy.css" />
  </head>
  <body>
    <div data-name="Decoy" style="width: 400px; background: #ffffff">
      <div
        data-name="Decoy sample"
        style="
          display: inline-block;
          font-family: 'Iso Text';
          font-size: 20px;
          line-height: 24px;
        "
      >ABCDEFGHIJ</div>
    </div>
  </body>
</html>
