<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hostile-document fixture</title>
    <!--
      The other direction. `mountDocument` adopts an imported document's
      stylesheets into the plugin's own <head> and leaves them there until the
      extraction is disposed, so for the length of every import a stranger's
      rules are live on the panel. This one is written to take it apart, using
      no `!important` at all: plain class rules that land AFTER the panel's own
      stylesheet in the document, which is all it takes to win on source order
      when specificity ties.

      The panel has to survive this while it is measuring, so the harness
      adopts this sheet exactly as mountDocument would and then reads the
      panel's own computed styles back.
    -->
    <style>
      .cd2f-header {
        display: block;
        padding: 40px;
      }
      .cd2f-title {
        font-size: 40px;
      }
      .cd2f-body {
        overflow-y: visible;
      }
      .cd2f-btn-primary {
        height: 90px;
      }
      #cd2f-app {
        height: 4000px;
        overflow: visible;
      }
      div {
        letter-spacing: 3px;
      }
    </style>
  </head>
  <body>
    <div data-name="Hostile" style="width: 100px; height: 100px; background: #123456"></div>
  </body>
</html>
