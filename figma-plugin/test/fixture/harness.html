<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Extractor harness</title>
    <style>
      body {
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        margin: 24px;
        max-width: 900px;
      }
      .pass { color: #1e8e3e; }
      .fail { color: #d93025; font-weight: 700; }
      h2 { font-size: 14px; margin: 20px 0 6px; }
      pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
  </head>
  <body>
    <h1>Claude Design → Figma: extractor harness</h1>
    <div id="results">Running…</div>
    <h2>IR tree</h2>
    <pre id="tree"></pre>

    <script src="bundle.js"></script>
    <script>
      const results = [];
      const check = (name, condition, detail) => {
        results.push({ name, ok: !!condition, detail: detail ?? "" });
      };

      const findByName = (node, name) => {
        if (node.name === name) return node;
        for (const child of node.children || []) {
          const hit = findByName(child, name);
          if (hit) return hit;
        }
        return null;
      };

      const outline = (node, depth = 0) => {
        const pad = "  ".repeat(depth);
        const layout = node.layout
          ? ` [${node.layout.mode.toLowerCase()} gap:${node.layout.gap} ${node.layout.source}]`
          : node.children.length > 1
            ? " [absolute]"
            : "";
        const tokens = [];
        for (const fill of node.fills || []) {
          if (fill.token) tokens.push(`${fill.token.name}(${fill.token.via})`);
        }
        if (node.border?.paint.token) {
          tokens.push(`border:${node.border.paint.token.name}`);
        }
        if (node.cornerToken) tokens.push(`radius:${node.cornerToken.name}`);
        if (node.layout?.gapToken) tokens.push(`gap:${node.layout.gapToken.name}`);
        const tokenText = tokens.length ? ` {${tokens.join(", ")}}` : "";
        let line = `${pad}${node.kind} "${node.name}" ${Math.round(node.width)}x${Math.round(node.height)}${layout}${tokenText}\n`;
        for (const child of node.children || []) line += outline(child, depth + 1);
        return line;
      };

      // IRDocument is plain JSON except IMAGE nodes carry `imageBytes` as a
      // Uint8Array, which JSON.stringify silently drops. Walk the tree and
      // swap any Uint8Array for a plain-JSON-safe { __u8: [...] } shape so
      // the Node-side test can convert it back. Shared by both the default
      // assertion run and the ?real=1 measurement run.
      const u8Safe = (value) => {
        if (value instanceof Uint8Array) return { __u8: Array.from(value) };
        if (Array.isArray(value)) return value.map(u8Safe);
        if (value && typeof value === "object") {
          const out = {};
          for (const key of Object.keys(value)) out[key] = u8Safe(value[key]);
          return out;
        }
        return value;
      };

      const capture = async (name, irDocument) => {
        try {
          const res = await fetch(`/capture/${name}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(u8Safe(irDocument)),
          });
          const json = await res.json();
          if (!res.ok || !json.ok) throw new Error(`server responded ${res.status}`);
          console.log(`HARNESS CAPTURED ${name} ${json.bytes}`);
          return { ok: true, bytes: json.bytes };
        } catch (e) {
          console.log(`HARNESS CAPTURE FAILED: ${e.message}`);
          return { ok: false, error: e.message };
        }
      };

      window.__CD2F_DEBUG = true;

      const params = new URLSearchParams(location.search);
      const realParam = params.get("real");
      // "?real=1" is a legacy alias for the original (and still default)
      // real fixture, homepage. "?real=<name>" loads real/<name>.html.
      const realName = realParam === "1" ? "homepage" : realParam;
      // "&ds=1" loads the Claude Design system's token CSS files
      // (test/fixture/real/ds-tokens/*.css — gitignored, fetched from the
      // live Claude Design project) and passes their concatenated text as
      // `extraCss`, simulating fix (A): a user supplying the design system
      // separately because the document itself only links a slice of it
      // (the deck fixture links only tokens/fonts.css).
      const dsFlag = params.get("ds") === "1";

      if (realName) {
        runReal(realName, dsFlag).catch((e) => {
          document.getElementById("results").innerHTML =
            `<div class="fail">Harness threw: ${e.message}</div>`;
          console.log(`HARNESS ERROR: ${e.message}\n${e.stack}`);
        });
      } else {
        runDefault().catch((e) => {
          document.getElementById("results").innerHTML =
            `<div class="fail">Harness threw: ${e.message}</div>`;
          console.log(`HARNESS ERROR: ${e.message}\n${e.stack}`);
        });
      }

      // -----------------------------------------------------------------
      // ?real=<name> — measurement run against a full-scale real fixture.
      // Not an assertion suite: fetches real/<name>.html, extracts it, and
      // reports scale/shape metrics instead. "?real=1" is a legacy alias
      // for name === "homepage".
      // -----------------------------------------------------------------
      async function runReal(name, withDs) {
        console.log(`HARNESS REAL start (${name}${withDs ? " +ds" : ""})`);
        const html = await (await fetch(`real/${name}.html`)).text();
        console.log(`HARNESS REAL fetched ${html.length} bytes`);

        // Fix (A): load the design-system token CSS separately and pass it
        // as extraCss, exactly as ui/main.ts does with the user-supplied
        // "Design system" file picker (designSystemCss).
        let extraCss;
        if (withDs) {
          const dsFiles = [
            "colors.css",
            "typography.css",
            "spacing.css",
            "shadows.css",
            "motion.css",
            "fonts.css",
          ];
          const parts = await Promise.all(
            dsFiles.map((f) => fetch(`real/ds-tokens/${f}`).then((r) => r.text())),
          );
          extraCss = parts.join("\n");
          console.log(
            `HARNESS REAL ds=1: loaded ${dsFiles.length} token files, ${extraCss.length} bytes of extraCss`,
          );
        }

        // Boot-phase modules (ExtractOptions.moduleSources, src/ir/index.ts):
        // sibling .js files a document's componentDidMount -> import() can
        // load, exactly as src/ui/main.ts's collectModuleSources populates
        // them from whatever else was dropped alongside the .dc.html. Opt in
        // with `?modules=a.js,b.js` (fetched from real/<name>) — e.g.
        // `?real=<fixture>&modules=data.js` for a real fixture whose script
        // has a `componentDidMount` (see resolve.ts's bootAndRender doc
        // comment). Empty/absent means "no sibling modules", exactly like a
        // lone-file drop in the real UI.
        const modulesParam = params.get("modules");
        const moduleNames = modulesParam
          ? modulesParam.split(",").map((s) => s.trim()).filter(Boolean)
          : [];
        let moduleSources;
        if (moduleNames.length > 0) {
          const sources = {};
          for (const fileName of moduleNames) {
            const text = await (await fetch(`real/${fileName}`)).text();
            sources[fileName] = text;
            sources[`./${fileName}`] = text;
          }
          moduleSources = sources;
          console.log(
            `HARNESS REAL modules: loaded ${moduleNames.join(", ")} as moduleSources`,
          );
        }

        const t0 = performance.now();
        const doc = await window.extractDocument(html, `Real ${name} fixture`, {
          viewportWidth: 1440,
          extraCss,
          moduleSources,
        });
        const elapsedMs = performance.now() - t0;
        console.log(`HARNESS REAL extracted in ${elapsedMs.toFixed(1)}ms`);

        // --- Single walk over the tree, collecting every stat at once ------
        let totalNodes = 0;
        let maxDepth = 0;
        const kindCounts = { FRAME: 0, TEXT: 0, IMAGE: 0, VECTOR: 0 };
        const layoutSourceCounts = {
          "explicit-flex": 0,
          "explicit-grid": 0,
          "inferred-stack": 0,
        };
        let absoluteFrames = 0;
        let boundTokenNodes = 0;
        // Fix (C): TEXT nodes whose characters are still a literal `{{ }}`
        // placeholder — i.e. content that needed Claude Design's runtime and
        // did not render. Quantifies "how much of the import is meaningful".
        let placeholderTextNodes = 0;

        // Distinct colours actually used in the document (as SOLID paints on
        // fills, borders, or text runs) that did NOT bind to any token. A
        // large count here is the signal that the token table is wrong (or
        // empty) for this surface, not merely that a few one-off colours slipped
        // through. Keyed by rounded hex + alpha so near-identical antialiasing
        // noise doesn't inflate the distinct count.
        const unmatchedColors = new Map(); // hex -> count

        const colorHex = (c) => {
          const toHex = (n) => Math.round(Math.max(0, Math.min(1, n)) * 255)
            .toString(16)
            .padStart(2, "0");
          const base = `#${toHex(c.r)}${toHex(c.g)}${toHex(c.b)}`.toUpperCase();
          return c.a < 1 ? `${base} @ ${c.a.toFixed(2)}a` : base;
        };

        const trackPaint = (paint) => {
          if (!paint || paint.type !== "SOLID" || paint.token) return;
          const hex = colorHex(paint.color);
          unmatchedColors.set(hex, (unmatchedColors.get(hex) ?? 0) + 1);
        };

        const nodeHasToken = (node) => {
          if (node.fills?.some((f) => f.token)) return true;
          if (node.border?.paint?.token) return true;
          if (node.cornerToken) return true;
          if (node.layout?.gapToken) return true;
          if (node.layout?.paddingTokens && Object.keys(node.layout.paddingTokens).length) {
            return true;
          }
          if (node.text?.styleToken) return true;
          if (node.text?.runs?.some((r) => r.fill?.token)) return true;
          return false;
        };

        const walkStats = (node, depth) => {
          totalNodes += 1;
          if (depth > maxDepth) maxDepth = depth;
          if (node.kind in kindCounts) kindCounts[node.kind] += 1;
          if (node.kind === "FRAME") {
            if (node.layout) {
              if (node.layout.source in layoutSourceCounts) {
                layoutSourceCounts[node.layout.source] += 1;
              }
            } else {
              absoluteFrames += 1;
            }
          }
          if (nodeHasToken(node)) boundTokenNodes += 1;
          if (node.kind === "TEXT" && node.text?.characters?.includes("{{")) {
            placeholderTextNodes += 1;
          }
          for (const fill of node.fills || []) trackPaint(fill);
          if (node.border?.paint) trackPaint(node.border.paint);
          for (const run of node.text?.runs || []) trackPaint(run.fill);
          for (const child of node.children || []) walkStats(child, depth + 1);
        };
        walkStats(doc.root, 1);

        const tokenCount = doc.designSystem?.tokens?.length ?? 0;
        const warnings = doc.warnings || [];
        const missingStylesheets = doc.missingStylesheets || [];

        const captureName = `real-${name}${withDs ? "-ds" : ""}`;
        const captureResult = await capture(captureName, doc);

        const unmatchedSorted = [...unmatchedColors.entries()].sort((a, b) => b[1] - a[1]);

        // Ground-truth check: optional `?expect=a|b|c` PIPE-separated list of
        // strings that should appear somewhere in the extracted TEXT once
        // real data (not a chrome-only/loading render) made it in — useful
        // for verifying a boot-phase fixture against values known from the
        // live page, without hardcoding any fixture's actual content into
        // the harness. Pipe-separated (not comma) since real values often
        // contain commas themselves (e.g. "6,017"). Collected by
        // concatenating every TEXT node's characters and checking
        // inclusion, not exact node identity.
        const expectParam = params.get("expect");
        const groundTruthLines = [];
        if (expectParam) {
          const expected = expectParam.split("|").map((s) => s.trim()).filter(Boolean);
          let allText = "";
          const collectText = (n) => {
            if (n.kind === "TEXT" && n.text?.characters) allText += n.text.characters + "\n";
            for (const c of n.children || []) collectText(c);
          };
          collectText(doc.root);
          groundTruthLines.push("--- ground-truth check ---");
          for (const needle of expected) {
            groundTruthLines.push(`${allText.includes(needle) ? "PRESENT" : "MISSING"} — "${needle}"`);
          }
        }

        const lines = [];
        lines.push(`extraction time: ${elapsedMs.toFixed(1)} ms`);
        lines.push(`total nodes: ${totalNodes}`);
        lines.push(`max tree depth: ${maxDepth}`);
        lines.push(
          `count by kind: FRAME=${kindCounts.FRAME} TEXT=${kindCounts.TEXT} IMAGE=${kindCounts.IMAGE} VECTOR=${kindCounts.VECTOR}`,
        );
        lines.push(`design-system tokens found: ${tokenCount}`);
        // Fix (C): markup that needed Claude Design's runtime (support.js) and
        // therefore did not render once scripts were stripped. Non-zero here
        // is what makes main.ts warn the user instead of silently importing
        // placeholder boxes.
        lines.push(
          `dynamicContent: placeholders=${doc.dynamicContent.placeholders} loops=${doc.dynamicContent.loops} components=${doc.dynamicContent.components}`,
        );
        // Boot-phase report (src/ui/resolve.ts's ResolveReport): did a
        // componentDidMount run, how many setState calls resulted, and which
        // sibling modules loaded vs were missing.
        const resolved = doc.dynamicContent.resolved || {};
        lines.push(
          `boot: ran=${!!resolved.ran} bootRan=${!!resolved.bootRan} setStateCalls=${resolved.setStateCalls ?? 0} ` +
            `modulesLoaded=${JSON.stringify(resolved.modulesLoaded ?? [])} modulesMissing=${JSON.stringify(resolved.modulesMissing ?? [])} ` +
            `importImpl=${resolved.importImpl ?? "(none)"} error=${resolved.error ?? "(none)"}`,
        );
        lines.push(
          `TEXT nodes carrying a literal {{ }} placeholder (unresolved): ${placeholderTextNodes} / ${kindCounts.TEXT} TEXT nodes`,
        );
        lines.push(
          `auto-layout frames: explicit-flex=${layoutSourceCounts["explicit-flex"]} explicit-grid=${layoutSourceCounts["explicit-grid"]} inferred-stack=${layoutSourceCounts["inferred-stack"]}`,
        );
        lines.push(`absolute frames: ${absoluteFrames}`);
        lines.push(`nodes with a bound token: ${boundTokenNodes}`);
        lines.push(
          `capture: ${captureResult.ok ? `OK (${captureResult.bytes} bytes to /capture/${captureName})` : `FAILED — ${captureResult.error}`}`,
        );
        lines.push(`warnings: ${warnings.length} total (first 20 below)`);
        warnings.slice(0, 20).forEach((w, i) => lines.push(`  ${i + 1}. ${w}`));
        if (warnings.length === 0) lines.push("  (none)");
        lines.push(`missingStylesheets empty: ${missingStylesheets.length === 0}`);
        if (missingStylesheets.length > 0) {
          missingStylesheets.forEach((href, i) => lines.push(`  missing ${i + 1}. ${href}`));
        }
        lines.push(
          `distinct colours with NO token match: ${unmatchedSorted.length} (sample up to 15 below, by usage count)`,
        );
        unmatchedSorted.slice(0, 15).forEach(([hex, count], i) => lines.push(`  ${i + 1}. ${hex} — used ${count}x`));
        if (unmatchedSorted.length === 0) lines.push("  (none — every colour used matched a token)");
        lines.push(...groundTruthLines);

        document.getElementById("results").innerHTML =
          `<h2>Real ${name}${withDs ? " + design system (ds=1)" : ""} fixture — measurement</h2><pre id="real-stats">${lines
            .join("\n")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")}</pre>`;
        document.getElementById("tree").textContent = outline(doc.root);

        console.log("HARNESS REAL DONE");
        for (const line of lines) console.log(`HARNESS REAL :: ${line}`);
      }

      // -----------------------------------------------------------------
      // Default run — the 36-assertion fixture suite. Unchanged behaviour.
      // -----------------------------------------------------------------
      async function runDefault() {
        console.log("HARNESS start");
        const html = await (await fetch("screen.html")).text();
        console.log(`HARNESS fetched ${html.length} bytes`);
        const doc = await window.extractDocument(html, "Fixture screen", {
          viewportWidth: 1200,
        });

        // --- Design system -------------------------------------------------
        const tokens = doc.designSystem?.tokens ?? [];
        check("design system detected", tokens.length > 0, `${tokens.length} tokens`);

        const primary = tokens.find((t) => t.name === "primary");
        check(
          "semantic token resolves through its alias",
          primary && primary.aliasOf === "acme-green-700",
          primary ? `primary -> ${primary.aliasOf}` : "primary missing",
        );
        check(
          "resolved value follows the var chain",
          primary && primary.resolved.toUpperCase() === "#1B6F58",
          primary?.resolved,
        );
        check(
          "non-token values (gradients) excluded from the token list",
          !tokens.some((t) => t.name === "acme-gradient"),
        );
        check(
          "spacing tokens become FLOAT",
          tokens.some((t) => t.name === "space-6" && t.kind === "FLOAT" && t.float === 24),
        );
        check(
          "ramp names become variable groups",
          tokens.some((t) => t.path === "color/acme-green/700"),
          tokens.find((t) => t.name === "acme-green-700")?.path,
        );

        // --- Layout inference ----------------------------------------------
        const header = findByName(doc.root, "Header");
        check("explicit flex becomes auto-layout", header?.layout?.source === "explicit-flex");
        check("flex gap read correctly", header?.layout?.gap === 24, String(header?.layout?.gap));
        check(
          "space-between preserved",
          header?.layout?.primaryAlign === "SPACE_BETWEEN",
          header?.layout?.primaryAlign,
        );
        check(
          "padding read from computed style",
          header?.layout?.padding.top === 24 && header?.layout?.padding.left === 24,
        );

        const even = findByName(doc.root, "Even stack");
        check(
          "even block stack is inferred as auto-layout",
          even?.layout?.source === "inferred-stack" && even?.layout?.mode === "VERTICAL",
          even?.layout ? `${even.layout.mode} gap:${even.layout.gap}` : "no layout",
        );
        check(
          "inferred gap snaps through sub-pixel noise to the authored 12px",
          even?.layout?.gap === 12,
          String(even?.layout?.gap),
        );

        // The board is the outermost inferred stack, and it regressed to
        // absolute once when a change to text geometry shifted sibling gaps —
        // with every other assertion still green. Pin it.
        const board = findByName(doc.root, "Board");
        check(
          "the outer board stays an inferred vertical stack",
          board?.layout?.source === "inferred-stack" && board?.layout?.mode === "VERTICAL",
          board?.layout ? `${board.layout.source}/${board.layout.mode}` : "no layout",
        );
        check(
          "body text keeps its line-box height, not the tighter glyph box",
          (() => {
            let hit = null;
            const scan = (n) => {
              if (n.kind === "TEXT" && n.text.characters.startsWith("Revenue rose")) hit = n;
              (n.children || []).forEach(scan);
            };
            scan(doc.root);
            // 15px text at line-height 1.55 is ~23px; the glyph box alone is ~17.
            return hit ? hit.height >= 21 : false;
          })(),
        );

        const uneven = findByName(doc.root, "Uneven stack");
        check(
          "uneven stack is left absolute (no false auto-layout)",
          uneven && !uneven.layout,
          uneven?.layout ? `wrongly got ${uneven.layout.source}` : "absolute",
        );

        // --- Token binding --------------------------------------------------
        const headerFill = header?.fills?.[0];
        check(
          "var() background binds by name",
          headerFill?.token?.via === "var" && headerFill?.token?.name === "card",
          headerFill?.token ? `${headerFill.token.name} via ${headerFill.token.via}` : "unbound",
        );
        check(
          "border colour binds to the border token",
          header?.border?.paint.token?.name === "border",
          header?.border?.paint.token?.name,
        );
        check(
          "literal hex reverse-matches to a primitive token",
          (() => {
            const button = header && findByName(header, "Button");
            return button?.fills?.[0]?.token?.name === "acme-green-700";
          })(),
        );
        check(
          "radius binds to a radius token, not a same-valued spacing token",
          header?.cornerToken?.name === "radius-lg",
          header?.cornerToken?.name,
        );
        check(
          "gap still binds to a spacing token",
          header?.layout?.gapToken?.name === "space-6",
          header?.layout?.gapToken?.name,
        );

        // --- Text ------------------------------------------------------------
        const text = findByName(doc.root, "Mixed text") ?? (() => {
          let hit = null;
          const scan = (n) => {
            if (n.kind === "TEXT" && n.text.characters.includes("Revenue rose")) hit = n;
            (n.children || []).forEach(scan);
          };
          scan(doc.root);
          return hit;
        })();
        check("mixed inline text becomes one TEXT node", text?.kind === "TEXT");
        check(
          "inline styles split into separate runs",
          (text?.text.runs.length ?? 0) >= 4,
          `${text?.text.runs.length} runs`,
        );
        check(
          "bold run keeps its weight and colour",
          text?.text.runs.some((r) => r.fontWeight === 700 && r.fill.token?.name === "acme-green-700"),
        );
        check(
          "italic run detected",
          text?.text.runs.some((r) => r.italic === true),
        );
        check(
          "link run carries href and underline",
          text?.text.runs.some((r) => r.href === "https://example.com/filing" && r.decoration === "UNDERLINE"),
        );
        check(
          "whitespace collapsed like the browser does",
          text && !/\s{2,}/.test(text.text.characters),
          JSON.stringify(text?.text.characters?.slice(0, 60)),
        );

        // --- Paint / effects --------------------------------------------------
        const gradient = findByName(doc.root, "Gradient card");
        const gradientFill = gradient?.fills?.find((f) => f.type === "GRADIENT_LINEAR");
        check("linear-gradient parsed", !!gradientFill, gradientFill ? `${gradientFill.stops.length} stops @ ${gradientFill.angle}deg` : "missing");
        check("gradient angle preserved", gradientFill?.angle === 180, String(gradientFill?.angle));

        check(
          "box-shadow parsed with spread",
          header?.effects?.some((e) => e.type === "DROP_SHADOW" && e.offsetY === 24 && e.spread === -28),
          JSON.stringify(header?.effects?.[0]),
        );

        const uppercase = gradient && findByName(gradient, "Reading key");
        check(
          "text-transform captured as textCase",
          (() => {
            let hit = null;
            const scan = (n) => {
              if (n.kind === "TEXT" && n.text.characters === "Reading key") hit = n;
              (n.children || []).forEach(scan);
            };
            scan(doc.root);
            return hit?.text.runs[0]?.textCase === "UPPER";
          })(),
        );

        const sideBorder = findByName(doc.root, "Side border");
        check(
          "per-side border weights preserved",
          sideBorder?.border?.weights.left === 3 && sideBorder?.border?.weights.top === 0,
          JSON.stringify(sideBorder?.border?.weights),
        );
        check("dashed border detected", sideBorder?.border?.dashed === true);

        let svgFound = false;
        const scanSvg = (n) => {
          if (n.kind === "VECTOR") svgFound = true;
          (n.children || []).forEach(scanSvg);
        };
        scanSvg(doc.root);
        check("inline SVG captured as vector", svgFound);

        check(
          "a complete file reports no missing stylesheets",
          doc.missingStylesheets.length === 0,
          JSON.stringify(doc.missingStylesheets),
        );

        // --- Missing design system (the common public case) -------------------
        // Claude Design downloads one file at a time, so the usual drop is a
        // lone .dc.html still linking _ds token CSS the user does not have.
        const orphaned = html.replace(
          'href="tokens.css"',
          'href="_ds/absent-design-system-9f2a1c04-b7e3/tokens/colors.css"',
        );
        const orphanDoc = await window.extractDocument(orphaned, "Orphaned", {
          viewportWidth: 1200,
        });

        check(
          "missing _ds stylesheet is detected and named",
          orphanDoc.missingStylesheets.some((href) => href.includes("_ds/")),
          JSON.stringify(orphanDoc.missingStylesheets),
        );
        check(
          "no design system is reported when its CSS is absent",
          !orphanDoc.designSystem,
          orphanDoc.designSystem ? `${orphanDoc.designSystem.tokens.length} tokens leaked` : "none",
        );
        check(
          "layout still imports without the design system",
          !!findByName(orphanDoc.root, "Header")?.layout,
        );
        check(
          "colours fall back to literals, not to stale tokens",
          (() => {
            const header = findByName(orphanDoc.root, "Header");
            if (!header) return false;
            // An unresolvable var() computes to transparent, so no fill is the
            // correct outcome; what matters is that nothing claims a token.
            return header.fills.every((fill) => !fill.token);
          })(),
        );

        // --- Scoped-surface token collision (fix B) -----------------------------
        // A Claude Design system can re-theme the same custom-property name
        // under a scoped selector (e.g. `.acme-deck` redefining --background).
        // tokens.ts only indexes the global :root layer, so a name match alone
        // would wrongly bind to the :root definition even where the scoped
        // value visibly rendered. matchTokenByVar rejects a name match whose
        // colour disagrees with what actually rendered and falls back to a
        // value match instead (test/fixture/scoped.html).
        const scopedHtml = await (await fetch("scoped.html")).text();
        const scopedDoc = await window.extractDocument(scopedHtml, "Scoped surface", {
          viewportWidth: 400,
        });
        const scopedFill = findByName(scopedDoc.root, "Scoped fill");
        const scopedColorHex = (c) => {
          const toHex = (n) =>
            Math.round(Math.max(0, Math.min(1, n)) * 255)
              .toString(16)
              .padStart(2, "0");

        };
        const scopedRenderedHex = scopedFill?.fills?.[0]?.color
          ? scopedColorHex(scopedFill.fills[0].color)
          : undefined;
        check(
          "scoped surface renders the .acme-deck override, not the :root value",
          scopedRenderedHex === "#FBFCFC",

        const scopedToken = scopedFill?.fills?.[0]?.token;

          !(scopedToken && scopedToken.name === "background" && scopedToken.via === "var"),

            ? `token: ${scopedToken.name} via ${scopedToken.via}`
            : "token: undefined (no value-match candidate for #FBFCFC in this fixture's token table)",

        // --- _ds_manifest.json: surfaces, annotations, build paths -----------
        // The manifest is the only place a token's per-surface values and its

        // CSSOM strips the comment the annotation lives in.

          namespace: "ScopedFixture_a1b2c3",
          themes: [{ selector: ".acme-deck", label: "Fixture Deck" }],
          tokens: [
            { name: "--background", value: "#FFFFFF", kind: "color" },
            { name: "--neutral-0", value: "#FFFFFF", kind: "color" },
            { name: "--dur-fast", value: "150ms", kind: "other", annotation: "other" },

        // colour disagrees with what rendered, and that guard only works while
        // the index holds the :root layer alone. Feed the deck's #FBFCFC into
        // it under the name "background" and the guard inverts: the name match

          "reading the manifest does not put a surface's value in the base token index",
          !(manifestToken && manifestToken.name === "background" && manifestToken.via === "var") &&

            background?.bySurface?.[".acme-deck"]?.resolved?.toUpperCase() === "#FBFCFC",
          `token=${manifestToken ? `${manifestToken.name} via ${manifestToken.via}` : "undefined"} ` +
            `base=${background?.resolved} deck=${background?.bySurface?.[".acme-deck"]?.resolved}`,

          "a token annotated @kind other is dropped even though its shape passes",

          "buildPath regroups a stranded ramp step while path stays put",

            byTokenName.get("neutral-0")?.buildPath === "color/neutral/0",
          `path=${byTokenName.get("neutral-0")?.path} buildPath=${byTokenName.get("neutral-0")?.buildPath}`,

          "surface metadata and shadow tokens reach the IR",

          "a literal colour value-matches inside its own theme, at that theme's value",

            lightSwatch?.fills?.[0]?.token?.name === "dv-muted" &&

            `chip=${axisByName.has("dv-chip-bg")} alias=${axisByName.has("dv-alias-bg")} ` +

        const noneHtml = await (await fetch("theme-axis-none.html")).text();
        const noneDoc = await window.extractDocument(noneHtml, "No axis", {

          noneDoc.designSystem?.surfaces === undefined &&
            scopedNodes.length === 0 &&
            // The :root layer still works exactly as it did.
            JSON.stringify(noneNames) === JSON.stringify(["nv-bg", "nv-text"]) &&
            findByName(noneDoc.root, "Base fill")?.fills?.[0]?.token?.name === "nv-bg" &&
            !findByName(noneDoc.root, "Chip ok")?.fills?.[0]?.token &&
            !findByName(noneDoc.root, "Alias a")?.fills?.[0]?.token,
          `surfaces=${JSON.stringify(noneDoc.designSystem?.surfaces)} tokens=${JSON.stringify(noneNames)} ` +
            `scoped=${JSON.stringify(scopedNodes)}`,

        // --- Root re-themes (test/fixture/theme-root*.html) --------------------

            JSON.stringify(rootLight.designSystem?.axis) === JSON.stringify([RT_DARK]) &&

            (pairDoc.designSystem?.tokens ?? []).find((t) => t.name === "lk-bg")?.resolved === "#fbf9f5",

        // --- Entrance motion (test/fixture/motion.dc.html) ----------------------
        // Measured offscreen and on the first frame, a real portfolio imported

          JSON.stringify(sn("Pseudo")?.children?.map((c) => c.name)),

          sn("Rotated")?.rotation === 12 && sn("Rotated")?.width === 100 && sn("Rotated")?.height === 40,

          JSON.stringify(sn("Stack")?.children?.map((c) => c.name)) === JSON.stringify(["Under B", "Top A"]),

        );

          JSON.stringify(sn("Avatar")?.cornerRadius),

        check(
          "CSS blur comes in at Figma's scale, twice the CSS number",
          sn("Blurred")?.effects?.some((e) => e.type === "LAYER_BLUR" && e.radius === 8),

          byText(stress.root, "Shadowed words")?.effects?.some((e) => e.type === "DROP_SHADOW" && e.offsetY === 2),
          JSON.stringify(byText(stress.root, "Shadowed words")?.effects),

          'hidden="{{ true }}" still drops the element',
          !findByName(boolDoc.root, "Truly hidden"),
          findByName(boolDoc.root, "Truly hidden") ? "wrongly still present" : "absent",
        );

        // --- Declared props: schema, defaults, overrides, merge order
        // (test/fixture/props.html) ---------------------------------------------
        // A document's own `data-props` is the only place a screen says what it
        // can be parameterised by. Nothing downstream of extractDocument carries
        // it, so the schema is asserted directly off the markup, and the three
        // scope layers (state, then props, then renderVals) are read back as
        // text from three sibling nodes that each read one of them.
        const propsHtml = await (await fetch("props.html")).text();
        const propsParsed = new DOMParser().parseFromString(propsHtml, "text/html");
        const propsSchema = window.readPropsSchema(propsParsed);
        const textOf = (root, name) => findByName(root, name)?.children?.[0]?.text?.characters;

        check(
          "data-props is read in declaration order, with $preview split off",
          JSON.stringify(propsSchema.props.map((p) => p.name)) ===
            JSON.stringify(["tone", "span", "loud", "shadowed", "label"]) &&
            propsSchema.preview?.width === 360 &&
            propsSchema.preview?.height === 120,

        );

        check(
          "only enum and boolean props are enumerable — int and untyped are not",
          JSON.stringify(enumerable.map((p) => `${p.name}(${p.values.length})`)) ===
            JSON.stringify(["tone(7)", "loud(2)"]),
          JSON.stringify(enumerable.map((p) => `${p.name}(${p.values.length})`)),
        );

        const propsDefaultDoc = await window.extractDocument(propsHtml, "Props default", {
          viewportWidth: 500,
        });
        check(
          "a declared default reaches the root component's props",
          textOf(propsDefaultDoc.root, "Plain") === "alpha",
          textOf(propsDefaultDoc.root, "Plain"),
        );
        check(
          "props beat state in the resolution scope",
          textOf(propsDefaultDoc.root, "Shadowed") === "from-props",
          textOf(propsDefaultDoc.root, "Shadowed"),
        );
        check(
          "renderVals() beats props in the resolution scope",
          textOf(propsDefaultDoc.root, "Rendered") === "from-renderVals",
          textOf(propsDefaultDoc.root, "Rendered"),

        const propsOverrideDoc = await window.extractDocument(propsHtml, "Props override", {
          viewportWidth: 500,
          propOverrides: { tone: "zeta" },

        check(
          "propOverrides beat the declared default",
          textOf(propsOverrideDoc.root, "Plain") === "zeta",
          textOf(propsOverrideDoc.root, "Plain"),
