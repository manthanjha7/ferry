        // --- dc-import: one Claude Design document embedded in another
        // (test/fixture/dcimport-host.html + dcimport-panel.dc.html) ------------
        // Before this resolved, a <dc-import> mounted as a childless unknown
        // element and walk() dropped it at the zero-size check, so a board made
        // of nothing but embedded panels imported as an empty strip — with
        // every counter reading correct, because nothing counted them.
        const dcPanelSrc = await (await fetch("dcimport-panel.dc.html")).text();
        const dcCycleSrc = await (await fetch("dcimport-cycle.dc.html")).text();
        // Keyed the way src/ui/main.ts's collectDocumentSources keys a real
        // drop: component name, lowercase alias, and the raw filename.
        const dcSources = {
          "Dcimport Panel": dcPanelSrc,
          "dcimport panel": dcPanelSrc,
          "dcimport-panel.dc.html": dcPanelSrc,
          "Dcimport Cycle": dcCycleSrc,
        };
        const dcHostHtml = await (await fetch("dcimport-host.html")).text();
        const dcDoc = await window.extractDocument(dcHostHtml, "Dc import host", {
          viewportWidth: 1400,
          documentSources: dcSources,
        });
        const dcResolved = dcDoc.dynamicContent.resolved;

        const findAllByName = (node, name) => {
          const out = [];
          const scan = (n) => {
            if (n.name === name) out.push(n);
            for (const child of n.children || []) scan(child);
          };
          scan(node);
          return out;
        };
        const dcHex = (node) => {
          const c = node?.fills?.[0]?.color;
          if (!c) return undefined;
          const toHex = (n) =>
            Math.round(Math.max(0, Math.min(1, n)) * 255)
              .toString(16)
              .padStart(2, "0");
          return `#${toHex(c.r)}${toHex(c.g)}${toHex(c.b)}`.toUpperCase();
        };

        const dcPanels = findAllByName(dcDoc.root, "Dcimport Panel");
        check(
          "every dc-import call site is gone from the mounted document",
          dcDoc.dynamicContent.documents === 0,
          `${dcDoc.dynamicContent.documents} left standing`,
        );
        check(
          "five call sites inlined, three stubbed, two targets compiled",
          // Five: four panels plus the cycle document's own outer call site,
          // which resolves normally — it is the self-reference INSIDE it that
          // is refused. Three stubs: both missing names and that refusal.
          dcResolved.documentsInlined === 5 &&
            dcResolved.documentsStubbed === 3 &&
            JSON.stringify(dcResolved.documentsResolved) ===
              JSON.stringify(["Dcimport Panel", "Dcimport Cycle"]),
          `inlined ${dcResolved.documentsInlined}, stubbed ${dcResolved.documentsStubbed}, resolved ${JSON.stringify(dcResolved.documentsResolved)}`,
        );
        check(
          "each inlined panel is a named host frame at the target's authored size",
          dcPanels.length === 4 && dcPanels.every((p) => p.width === 180 && p.height === 90),
          JSON.stringify(dcPanels.map((p) => `${p.width}x${p.height}`)),
        );
        // A `display:contents` host measures 0x0 and every descendant's x/y is
        // then computed against that zero rect. The panel body sits flush in
        // the host, so anything but (0,0) means the wrapper is not a real box.
        check(
          "the host wrapper is a real box, so its content is not offset against a zero rect",
          dcPanels.every((p) => {
            const body = (p.children || [])[0];
            return body && body.name === "Panel body" && body.x === 0 && body.y === 0;
          }),
          JSON.stringify(
            dcPanels.map((p) => `${p.children?.[0]?.name}@${p.children?.[0]?.x},${p.children?.[0]?.y}`),
          ),
        );
        const dcCaptions = dcPanels.map(
          (p) => findByName(p, "Panel chip")?.children?.[0]?.text?.characters,
        );
        check(
          "each call site renders on its own instance, with its own props",
          JSON.stringify(dcCaptions) ===
            JSON.stringify(["tone=one", "tone=two", "tone=three", "tone=dark"]),
          JSON.stringify(dcCaptions),
        );
        // "Cell three" exists only inside <sc-if value="{{ showThird }}">, whose
        // children live in a <template>'s inert .content fragment. A tree pass
        // placed before conditionals are applied finds three call sites, not four.
        check(
          "a dc-import inside <sc-if> is reached, which querySelectorAll cannot do",
          dcCaptions.includes("tone=three"),
          JSON.stringify(dcCaptions),
        );
        // THE assertion this whole step turns on. The target defines
        // --dcip-surface in its OWN helmet and writes every colour as
        // var(--dcip-surface, #ffffff). Without the hoist into the parent head,
        // extract.ts never adopts that rule, every var() falls back to its
        // literal, and all four panels import white while every counter above
        // stays green.
        check(
          "a target's helmet custom property resolves, rather than falling back to the var() literal",
          dcHex(findByName(dcPanels[0], "Panel body")) === "#123456",
          dcHex(findByName(dcPanels[0], "Panel body")),
        );
        check(
          "the dark call site picks the target's dark rule, not its light one",
          dcHex(findByName(dcPanels[3], "Panel body")) === "#2C2C2C",
          dcHex(findByName(dcPanels[3], "Panel body")),
        );
        const dcMissing = findByName(dcDoc.root, "Missing Panel");
        check(
          "a missing target becomes a visible hint-sized box, not a dropped element",
          dcMissing?.width === 200 &&
            dcMissing?.height === 120 &&
            JSON.stringify([...dcResolved.documentsMissing].sort()) ===
              JSON.stringify(["Missing Panel", "Unsized Panel"]),
          `${dcMissing?.width}x${dcMissing?.height}, missing ${JSON.stringify(dcResolved.documentsMissing)}`,
        );
        const dcUnsized = findByName(dcDoc.root, "Unsized Panel");
        check(
          "a missing target with no hint-size falls back to the 60px default height",
          dcUnsized?.height === 60,
          `${dcUnsized?.width}x${dcUnsized?.height}`,
        );
        check(
          "a self-importing document is refused once and named, not recursed into",
          dcResolved.documentCycles.length === 1 &&
            dcResolved.documentCycles[0] === "Dcimport Cycle → Dcimport Cycle",
          JSON.stringify(dcResolved.documentCycles),
        );
        // The counters above are what the UI's hold decision reads; these two
        // are what the user is actually told. A correctly sized grey box with
        // no name attached to it is indistinguishable from a design decision,
        // so the summary has to say which file to go and fetch.
        check(
          "every missing embedded document is named in the import summary",
          dcDoc.warnings.some(
            (w) => w.includes("Missing Panel") && w.includes("Unsized Panel"),
          ),
          JSON.stringify(dcDoc.warnings),
        );
        // The panel's helmet holds a <script> that mountDocument never adopts.
        // Without this the difference between Claude Design's render and ours
        // is a font or a polyfill that simply is not there, with every counter
        // reading correct.
        check(
          "a dropped helmet script is counted and reported, not silently discarded",
          dcResolved.helmetScriptsDropped === 1 &&
            dcDoc.warnings.some((w) => w.includes("<helmet>")),
          `dropped ${dcResolved.helmetScriptsDropped}, warnings ${JSON.stringify(dcDoc.warnings)}`,
        );

        // --- dc-import in a document with no script of its own
        // (test/fixture/dcimport-scriptless.html) -------------------------------
        // The entry gate used to return early on "no data-dc-script", which
        // leaves a pure-markup canvas board's dc-imports unresolved. The
        // relaxation must not become a tree-wide pass against an empty scope:
        // that rewrites every {{ }} to "" and the UI stops warning about
        // documents it genuinely cannot render.
        const dcNoScriptHtml = await (await fetch("dcimport-scriptless.html")).text();
        const dcNoScriptDoc = await window.extractDocument(dcNoScriptHtml, "Dc import scriptless", {
          viewportWidth: 600,
          documentSources: dcSources,
        });
        check(
          "a script-less document still inlines its dc-imports",
          dcNoScriptDoc.dynamicContent.resolved.documentsInlined === 1 &&
            dcNoScriptDoc.dynamicContent.documents === 0,
          `inlined ${dcNoScriptDoc.dynamicContent.resolved.documentsInlined}, left ${dcNoScriptDoc.dynamicContent.documents}`,
        );
        check(
          "a script-less document's own {{ }} placeholders are left alone, so the UI still warns",
          dcNoScriptDoc.dynamicContent.placeholders > 0 &&
            dcNoScriptDoc.dynamicContent.resolved.ran === false &&
            findByName(dcNoScriptDoc.root, "Unresolvable")?.children?.[0]?.text?.characters ===
              "{{ neverResolves }}",
          `placeholders ${dcNoScriptDoc.dynamicContent.placeholders}, ran ${dcNoScriptDoc.dynamicContent.resolved.ran}, text ${JSON.stringify(findByName(dcNoScriptDoc.root, "Unresolvable")?.children?.[0]?.text?.characters)}`,
        );
        // Every sibling this document names was supplied, so there is nothing
        // to go and fetch. A warning that fires on "this document embeds
        // something" rather than on "something is missing" trains people to
        // ignore the panel, which is worse than not warning at all.
        check(
          "a document whose siblings all resolved is not told anything is missing",
          dcNoScriptDoc.dynamicContent.resolved.documentsMissing.length === 0 &&
            !dcNoScriptDoc.warnings.some((w) => w.includes("placeholder box")),
          JSON.stringify(dcNoScriptDoc.warnings),
        );

        // --- State matrix: one mount per prop combination
        // (test/fixture/states-mini.dc.html) -----------------------------------
        // extractStateMatrix is the only path that mounts the same document
        // once per combination, and until this ran it had no browser coverage
        // at all. test/e2e/run.ts scenario N asserts the PLANNING half over
        // synthetic documents, and the plan is still right when every mount
        // renders the same picture: changing `propOverrides: combo.values` to
        // `propOverrides: {}` in src/ui/extract.ts left the whole suite green
        // while a real 14-frame Portage import came back as fourteen identical
        // default panels, every one correctly named and correctly stamped with
        // `doc.props`. Counts and names cannot see that. Difference can, so
        // everything below reads the frames rather than the labels.
        const statesHtml = await (await fetch("states-mini.dc.html")).text();
        const statesAxes = window.documentStateAxes(statesHtml);
        check(
          "the enum props become axes in declaration order, the int and untyped ones do not",
          JSON.stringify(statesAxes.map((a) => `${a.name}(${a.values.join("|")})`)) ===
            JSON.stringify(["state(empty|ready|done)", "theme(light|dark)"]),
          JSON.stringify(statesAxes.map((a) => `${a.name}(${a.values.join("|")})`)),
        );

        const stateDocs = await window.extractStateMatrix(statesHtml, "States Mini", {
          states: { props: ["state", "theme"] },
        });
        // What each frame's name claims, parsed back out of the name itself.
        // Reading the claim from the name and the truth from the tree is the
        // link the sabotage severs, so the two sides are never taken from the
        // same place.
        const statesClaim = (doc) => {
          const claim = {};
          for (const part of doc.name.split(" · ").slice(1)) {
            const [key, value] = part.split("=");
            claim[key] = value;
          }
          return claim;
        };
        const statesSurface = (doc) => dcHex(findByName(doc.root, "State surface"));
        const statesStatus = (doc) => textOf(doc.root, "Status");
        const statesDetail = (doc) => textOf(doc.root, "Detail");
        const STATES_TEXT = {
          empty: ["No file loaded.", "Drop a file to begin."],
          ready: ["homepage.html ready.", "42 layers to create."],
          done: ["Imported.", "42 layers created."],
        };
        const STATES_SURFACE = { light: "#FFFFFF", dark: "#1E1E1E" };

        check(
          "3 x 2 mounts as six frames, axis 0 fastest, named from the combination",
          JSON.stringify(stateDocs.map((d) => d.name)) ===
            JSON.stringify([
              "States Mini · state=empty · theme=light",
              "States Mini · state=ready · theme=light",
              "States Mini · state=done · theme=light",
              "States Mini · state=empty · theme=dark",
              "States Mini · state=ready · theme=dark",
              "States Mini · state=done · theme=dark",
            ]),
          JSON.stringify(stateDocs.map((d) => d.name)),
        );
        // The assertion that would have caught it on its own. Six frames whose
        // rendered content collapses to one picture is the exact failure, and
        // it is invisible to every count in the suite.
        const statesPrints = stateDocs.map(
          (d) => `${statesStatus(d)} | ${statesDetail(d)} | ${statesSurface(d)}`,
        );
        check(
          "every combination renders a different frame, by text or by fill",
          new Set(statesPrints).size === stateDocs.length,
          `${new Set(statesPrints).size} distinct of ${stateDocs.length}: ${JSON.stringify(statesPrints)}`,
        );
        check(
          "the frame named theme=dark is the one carrying the dark surface",
          stateDocs.every((d) => statesSurface(d) === STATES_SURFACE[statesClaim(d).theme]),
          JSON.stringify(stateDocs.map((d) => `${statesClaim(d).theme}:${statesSurface(d)}`)),
        );
        check(
          "the frame named state=<x> is the one showing state <x>'s text",
          stateDocs.every(
            (d) =>
              statesStatus(d) === STATES_TEXT[statesClaim(d).state][0] &&
              statesDetail(d) === STATES_TEXT[statesClaim(d).state][1],
          ),
          JSON.stringify(stateDocs.map((d) => `${statesClaim(d).state}:${statesStatus(d)}`)),
        );
        // `doc.props` is what src/plugin/build.ts stamps onto the Figma node,
        // so a frame whose stamp disagrees with its own pixels hands a designer
        // a component definition that is wrong in the one place they will trust
        // it. Checked against the render, not against the name, because the
        // name and the stamp are both written from the same combination and
        // will always agree with each other.
        check(
          "the props stamped on a frame are the props it actually rendered",
          stateDocs.every(
            (d) =>
              statesStatus(d) === STATES_TEXT[d.props.state][0] &&
              statesSurface(d) === STATES_SURFACE[d.props.theme],
          ),
          JSON.stringify(
            stateDocs.map((d) => `${d.props.state}/${d.props.theme}:${statesStatus(d)}`),
          ),
        );
        // The surface measures well under 200px tall, so an unfloored matrix
        // would import as a grid of ragged cells for what is one component.
        check(
          "every frame is grown to the declared $preview, so the matrix is a grid",
          stateDocs.every((d) => d.root.width === 320 && d.root.height === 200) &&
            stateDocs.every((d) => !d.warnings.some((w) => w.includes("larger than"))),
          JSON.stringify(stateDocs.map((d) => `${d.root.width}x${d.root.height}`)),
        );

        // --- Form controls (test/fixture/form-controls.html) --------------------
        // A <select>'s chosen option, an <input>'s value or placeholder and a
        // <textarea>'s placeholder are visible text that is not a DOM text
        // node, so the text walk never saw any of it: 50 strings and 32
        // checkboxes were dropped out of the Portage export in silence. These
        // assertions are on the OUTPUT — the string, and where it landed —
        // because a count of nodes stayed green through the whole outage.
        const formHtml = await (await fetch("form-controls.html")).text();
        const formDoc = await window.extractDocument(formHtml, "Form controls", {
          viewportWidth: 400,
        });
        const formText = (name) => {
          const frame = findByName(formDoc.root, name);
          return frame?.children?.find((c) => c.kind === "TEXT");
        };
        const formStrings = [];
        (function collectStrings(node) {
          if (node.kind === "TEXT") formStrings.push(node.text.characters);
          for (const child of node.children || []) collectStrings(child);
        })(formDoc.root);

        check(
          "a <select>'s chosen option is extracted as text",
          formStrings.includes("Create a new local collection") &&
            formStrings.includes("Semantic tokens"),
          JSON.stringify(formStrings),
        );
        // The load-bearing geometry assertion. A native select insets its text
        // by 4px past its own padding and reserves 16px for the arrow, both
        // measured off Chrome's render; the frame is 360 wide with a 1px border
        // and 6px padding, so the text box is 11 -> 326 and NOT 7 -> 346.
        check(
          "the option text is inset past the select's padding and its arrow",
          (() => {
            const t = formText("Collection picker");
            return t && t.x === 11 && t.width === 326;
          })(),
          (() => {
            const t = formText("Collection picker");
            return t ? `x=${t.x} w=${t.width}` : "no text node";
          })(),
        );
        check(
          "appearance:none removes both, so the text starts at the content edge",
          (() => {
            const t = formText("Styled picker");
            return t && t.x === 7 && t.width === 346;
          })(),
          (() => {
            const t = formText("Styled picker");
            return t ? `x=${t.x} w=${t.width}` : "no text node";
          })(),
        );
        // The arrow Chrome paints is UA chrome with no DOM node, so the 16px
        // band its padding reserved imported empty. A synthesised chevron fills
        // it: pinned absolutely at the trailing edge (360 - 1 border - 6 padding
        // - 16 band + 3 to centre a 10px glyph = x 340), vertically centred in
        // the 24px control (y 9), and NOT stacked with the option text.
        const arrowOf = (name) =>
          findByName(formDoc.root, name)?.children?.find((c) => c.kind === "VECTOR");
        check(
          "a native select gets a chevron pinned in its arrow band",
          (() => {
            const a = arrowOf("Collection picker");
            return (
              a &&
              a.absolute === true &&
              a.x === 340 &&
              a.y === 9 &&
              a.width === 10 &&
              a.height === 6 &&
              /<path\b/.test(a.svg || "")
            );
          })(),
          (() => {
            const a = arrowOf("Collection picker");
            return a
              ? `x=${a.x} y=${a.y} ${a.width}x${a.height} abs=${a.absolute}`
              : "no vector child";
          })(),
        );
        // Negative control: an appearance:none select drew its own arrow, so a
        // second synthesised one would double it. This stays green when the
        // chevron code is reverted; only the assertion above goes red.
        check(
          "an appearance:none select is left to its own drawn arrow",
          !arrowOf("Styled picker"),
          arrowOf("Styled picker") ? "unexpected chevron" : "none",
        );
        // A one-line control centres its value in the content box: an input of
        // the same font at height 24 and at height 40 puts its ink at y=8 and
        // y=16. 24 less a 2px border is 22 of content, an 11px line box is
        // 13.75, so the top of the line sits at 1 + (22 - 13.75) / 2.
        check(
          "a single-line control's value is vertically centred, not top-aligned",
          (() => {
            const t = formText("Named field");
            return (
              t &&
              Math.abs(t.y - 5.13) < 0.1 &&
              t.text.verticalAlign === "CENTER" &&
              t.text.characters === "Portage panel"
            );
          })(),
          (() => {
            const t = formText("Named field");
            return t ? `y=${t.y} vAlign=${t.text.verticalAlign}` : "no text node";
          })(),
        );
        check(
          "a right-aligned number field keeps its alignment through the frame",
          (() => {
            const frame = findByName(formDoc.root, "Width field");
            const t = formText("Width field");
            return (
              t &&
              t.text.characters === "1440" &&
              t.text.align === "RIGHT" &&
              frame.layout?.crossAlign === "MAX"
            );
          })(),
          (() => {
            const frame = findByName(formDoc.root, "Width field");
            const t = formText("Width field");
            return `${t?.text.characters} align=${t?.text.align} cross=${frame?.layout?.crossAlign}`;
          })(),
        );
        check(
          "an empty input and an empty textarea import their placeholders",
          formStrings.includes("Search filings") &&
            formStrings.includes("<!doctype html> …"),
          JSON.stringify(
            formStrings.filter((s) => s.includes("Search") || s.includes("doctype")),
          ),
        );
        // ::placeholder is its own cascade. Painting the placeholder in the
        // control's `color` would put near-black text where the screen showed
        // grey.
        check(
          "a placeholder is drawn in ::placeholder's colour, not the control's",
          (() => {
            const c = formText("Empty field")?.text.runs[0]?.fill.color;
            return c && scopedColorHex(c) === "#B3B3B3";
          })(),
          (() => {
            const c = formText("Empty field")?.text.runs[0]?.fill.color;
            return c ? scopedColorHex(c) : "no run";
          })(),
        );
        // The two shapes that already worked. A <button>'s label and a
        // <textarea>'s initial value ARE child text nodes, and the existing walk
        // measures them with a Range, so it knows this one line of copy is one
        // line inside a 36px box. The control path cannot know that — it has no
        // laid-out text to measure — and would call the same string wrapped.
        // Claiming these controls would therefore change a HUG label into a
        // FILL one, so the assertion is that they still come out of the old
        // path, not merely that the string is present.
        check(
          "text that was already a DOM node still comes out of the ordinary walk",
          formStrings.filter((s) => s === "Import").length === 1 &&
            formStrings.filter((s) => s === "Already a text node").length === 1 &&
            formText("Filled box")?.text.singleLine === true &&
            formText("Filled box")?.sizing.horizontal === "HUG" &&
            // ...while the placeholder beside it, which only the control path
            // can see, is correctly treated as filling its box.
            formText("Paste box")?.text.singleLine === false,
          `filled singleLine=${formText("Filled box")?.text.singleLine} ` +
            `sizing=${formText("Filled box")?.sizing.horizontal} ` +
            `placeholder singleLine=${formText("Paste box")?.text.singleLine}`,
        );
        // A checked checkbox has no text but is a visible 13x13 swatch. Chrome
        // reports background-color: rgba(0,0,0,0) and border: 0px for it, so
        // without this it is an empty frame with nothing in it at all.
        check(
          "a checked checkbox becomes a frame filled with its accent colour",
          (() => {
            const box = findByName(formDoc.root, "Checked box");
            const fill = box?.fills?.[0];
            return (
              fill &&
              scopedColorHex(fill.color) === "#0D99FF" &&
              box.cornerRadius.tl === 2 &&
              !box.border
            );
          })(),
          (() => {
            const box = findByName(formDoc.root, "Checked box");
            return box?.fills?.[0]
              ? `${scopedColorHex(box.fills[0].color)} r=${box.cornerRadius.tl} border=${!!box.border}`
              : "no fill";
          })(),
        );
        check(
          "an unchecked box is an outline, and a checked radio is a full circle",
          (() => {
            const off = findByName(formDoc.root, "Unchecked box");
            const dot = findByName(formDoc.root, "Checked dot");
            return (
              off?.border?.weights.top === 1 &&
              scopedColorHex(off.border.paint.color) === "#767676" &&
              // Chrome's own paint, never bound to one of the design's variables.
              !off.border.paint.token &&
              !off.fills[0].token &&
              dot?.cornerRadius.tl === 6.5
            );
          })(),
          (() => {
            const off = findByName(formDoc.root, "Unchecked box");
            const dot = findByName(formDoc.root, "Checked dot");
            return `border=${off?.border ? scopedColorHex(off.border.paint.color) : "none"} radius=${dot?.cornerRadius.tl}`;
          })(),
        );
        // display:none is still display:none: a hidden file input must not
        // become a "Choose File" layer nobody can see on the page.
        check(
          "a display:none control contributes nothing",
          !findByName(formDoc.root, "Hidden file"),
        );

        // --- Line height (test/fixture/line-height.html) ------------------------
        // `line-height: normal` is the font's own leading, which Chrome and
        // Figma read off possibly different faces; left as AUTO the block sits
        // shorter in Figma than on screen, line by line. The extractor measures
        // Chrome's actual strut and pins it, so a paragraph keeps its height.
        const lhHtml = await (await fetch("line-height.html")).text();
        const lhDoc = await window.extractDocument(lhHtml, "Line height", {
          viewportWidth: 400,
        });
        const lhLine = (name) =>
          findByName(lhDoc.root, name)?.text?.runs?.[0]?.lineHeight;
        check(
          "line-height:normal is pinned to a measured pixel value, not left as AUTO",
          (() => {
            const lh = lhLine("Normal metrics");
            // Arial-normal is ~1.15x; the wide bound only rules out AUTO (null)
            // and a nonsense measurement, so it holds across font versions.
            return typeof lh === "number" && lh > 16 && lh < 24;
          })(),
          `lineHeight=${lhLine("Normal metrics")}`,
        );
        check(
          "an authored line-height is carried through unchanged",
          lhLine("Fixed metrics") === 28,
          `lineHeight=${lhLine("Fixed metrics")}`,
        );

        // --- Clipping (test/fixture/overflow.html) ------------------------------
        // `clips` used to test the `overflow` SHORTHAND for the exact string
        // "hidden". A scroll region written `overflow-y:auto; overflow-x:hidden`
        // computes that shorthand to "hidden auto", so it matched nothing and
        // 16 regions in the Portage export imported unclipped, spilling 45 to
        // 214px of content over a pinned footer.
        const overflowHtml = await (await fetch("overflow.html")).text();
        const overflowDoc = await window.extractDocument(overflowHtml, "Overflow", {
          viewportWidth: 400,
        });
        const clipsOf = (name) => findByName(overflowDoc.root, name)?.clips;

        check(
          "a one-axis scroll region clips, though its shorthand is 'hidden auto'",
          clipsOf("Scroll region") === true,
          `clips=${clipsOf("Scroll region")}`,
        );
        // Same box, from the other side: the footer under that region has to
        // still be the bottom of the panel. If the region does not clip, its
        // rows paint straight over it.
        check(
          "the region really does overflow, so clipping is what is being tested",
          (() => {
            const region = findByName(overflowDoc.root, "Scroll region");
            if (!region) return false;
            const bottom = Math.max(...region.children.map((c) => c.y + c.height));
            return bottom > region.height + 20;
          })(),
          (() => {
            const region = findByName(overflowDoc.root, "Scroll region");
            const bottom = Math.max(...region.children.map((c) => c.y + c.height));
            return `content reaches ${Math.round(bottom)} in a box of ${region.height}`;
          })(),
        );
        check(
          "auto and scroll clip as well, since Figma has no scrollbar to offer",
          clipsOf("Auto both") === true && clipsOf("Scroll both") === true,
          `auto=${clipsOf("Auto both")} scroll=${clipsOf("Scroll both")}`,
        );
        check(
          "overflow:clip still clips, and one clipped axis is enough",
          clipsOf("Clip both") === true && clipsOf("Hidden on x only") === true,
          `clip=${clipsOf("Clip both")} xOnly=${clipsOf("Hidden on x only")}`,
        );
        // The other half of the contract: nothing starts clipping that was not
        // clipping before. An overflowing box that the browser lets spill has
        // to keep spilling, or content disappears off a design that showed it.
        check(
          "overflow:visible does not clip, and neither do plain blocks",
          clipsOf("Visible both") === false &&
            clipsOf("Pinned header") === false &&
            clipsOf("Pinned footer") === false,
          `visible=${clipsOf("Visible both")} header=${clipsOf("Pinned header")}`,
        );

        // --- Fixed-size boxes must not hug (test/fixture/fixed-box.html) --------
        // A 24px icon square that centres one glyph was imported hugging its
        // text, so the box collapsed onto the letter: the 16px Portage logo
        // came in as an 8px bar in all 14 panels. It must stay FIXED. The pill
        // beside it is the control: its width is its label plus padding, so it
        // sits tight against its text and still hugs.
        const fixedBoxHtml = await (await fetch("fixed-box.html")).text();
        const fixedBoxDoc = await window.extractDocument(fixedBoxHtml, "Fixed box", {
          viewportWidth: 400,
        });
        const frameWithText = (label) => {
          let hit = null;
          const scan = (n) => {
            if (
              n.kind === "FRAME" &&
              (n.children || []).some(
                (c) => c.kind === "TEXT" && c.text?.characters?.trim() === label,
              )
            )
              hit = n;
            (n.children || []).forEach(scan);
          };
          scan(fixedBoxDoc.root);
          return hit;
        };
        const iconBox = frameWithText("P");
        const pill = frameWithText("Active");
        // hugContent is the flag that drives the collapse: it makes the builder
        // set the frame's axes to AUTO, which recomputes its width down onto the
        // glyph. The IR width field is the measured 24 either way, so it is
        // hugContent, not width, that has to be asserted here.
        check(
          "a fixed-size box does not hug its text (icon stays a square)",
          iconBox?.layout?.hugContent === false,
          `hugContent=${iconBox?.layout?.hugContent} measured=${Math.round(iconBox?.width ?? 0)}x${Math.round(iconBox?.height ?? 0)}`,
        );
        check(
          "a pill whose width is its label still hugs (negative control)",
          pill?.layout?.hugContent === true,
          `hugContent=${pill?.layout?.hugContent} width=${Math.round(pill?.width ?? 0)}`,
        );

        // --- Canvas background (test/fixture/canvas-background.html) ------------
        // The imported frame used to take its fill from
        // getComputedStyle(document.body) — the HOST page's body, because the
        // document is mounted into it rather than into an iframe. The plugin
        // paints that body var(--figma-color-bg) !important, so the same import
        // came back #FFFFFF on Figma's light theme and #2C2C2C on dark while
        // Portage.dc.html authors body{background:#eceded}.
        //
        // The host page is painted a colour that is in no fixture before each
        // extraction below, which is exactly what the plugin's !important rule
        // does. If the fill ever comes back #FF00FF the old bug is back.
        const canvasHtml = await (await fetch("canvas-background.html")).text();
        const HOST_PAINT = "#ff00ff";
        const extractOverHost = async (html, options) => {
          const before = document.body.style.cssText;
          document.body.style.setProperty("background", HOST_PAINT, "important");
          try {
            return await window.extractDocument(html, "Canvas", {
              viewportWidth: 400,
              ...options,
            });
          } finally {
            document.body.style.cssText = before;
          }
        };
        const rootHex = (doc) =>
          doc.root.fills?.[0]?.color ? scopedColorHex(doc.root.fills[0].color) : undefined;

        const canvasDoc = await extractOverHost(canvasHtml);
        check(
          "the imported frame's fill is the document's canvas, not the host page's",
          rootHex(canvasDoc) === "#ECEDED",
          `root fill ${rootHex(canvasDoc)} while the host body was ${HOST_PAINT}`,
        );
        // The colour is authored as var(--dv-canvas), so arriving at #ECEDED at
        // all means the variable was resolved rather than parsed and dropped.
        check(
          "a canvas declared through var() binds to the variable it names",
          canvasDoc.root.fills?.[0]?.token?.name === "dv-canvas" &&
            canvasDoc.root.fills[0].token.via === "var",
          JSON.stringify(canvasDoc.root.fills?.[0]?.token),
        );

        // A document that says nothing about its background gets what a browser
        // paints behind a page that says nothing. Never the host's colour.
        const bareHtml = canvasHtml.replace("background: var(--dv-canvas);", "");
        const bareDoc = await extractOverHost(bareHtml);
        check(
          "a document with no canvas rule falls back to white, not to the host",
          rootHex(bareDoc) === "#FFFFFF",
          `root fill ${rootHex(bareDoc)}`,
        );

        // extraCss is a design system the user handed to the picker, and
        // _ds/*/tokens/typography.css really does ship a body{} rule. It is not
        // this document declaring what colour it is.
        const suppliedDoc = await extractOverHost(bareHtml, {
          extraCss: "body { background: #00ff00 }",
        });
        check(
          "a separately supplied stylesheet's body rule does not repaint the canvas",
          rootHex(suppliedDoc) === "#FFFFFF",
          `root fill ${rootHex(suppliedDoc)}`,
        );

        // --- Layer names (test/fixture/frame-names.html) ------------------------
        // 100 of the Portage export's 589 frames were called "Frame", 24 of
        // them holding real text, and a layer panel with a hundred identical
        // entries in it cannot be navigated. Every shape below is one that
        // landed there, and every assertion names the frame it expects rather
        // than counting how many are left, because a count says nothing about
        // whether the names are right.
        const namesHtml = await (await fetch("frame-names.html")).text();
        const namesDoc = await window.extractDocument(namesHtml, "Frame names", {
          viewportWidth: 400,
        });
        const namesUsed = [];
        (function collectNames(node) {
          if (node.kind === "FRAME") namesUsed.push(node.name);
          for (const child of node.children || []) collectNames(child);
        })(namesDoc.root);

        check(
          "no frame in this fixture is left called 'Frame'",
          !namesUsed.includes("Frame"),
          JSON.stringify(namesUsed),
        );
        check(
          "a painted hairline is named as the separator it is",
          namesUsed.filter((n) => n === "Divider").length === 2,
          JSON.stringify(namesUsed.filter((n) => n === "Divider")),
        );
        check(
          "an empty unpainted box is named as the space it holds open",
          !!findByName(namesDoc.root, "Spacer"),
          JSON.stringify(namesUsed),
        );
        // The old rule refused any caption over 40 characters, which is how a
        // 97-character one ended up as "Frame" while `truncate` was right there.
        check(
          "a caption too long for the old cap is still named from its copy",
          !!findByName(namesDoc.root, "Only needed when the document d…"),
          JSON.stringify(namesUsed),
        );
        // The load-bearing one for multi-child containers, and the reason the
        // rule tests `display: inline` exactly: three spans are one sentence,
        // two buttons are two components.
        check(
          "a line of prose across inline spans is named from the whole line",
          !!findByName(namesDoc.root, "none · add token files"),
          JSON.stringify(namesUsed),
        );
        // A name is a description of what is on the canvas. "forget" and
        // "unsaved" both sit in display:none spans, so textContent has them and
        // the layer panel must not. "Saved" is named by the rule that was
        // already there, which read textContent too.
        check(
          "text inside a display:none subtree never reaches a name",
          namesUsed.includes("Saved") &&
            !namesUsed.some((n) => n.includes("unsaved") || n.includes("forget")),
          JSON.stringify(namesUsed.filter((n) => n.includes("Saved") || n.includes("·"))),
        );
        check(
          "role is read as authored intent, like aria-label",
          !!findByName(namesDoc.root, "Tablist"),
          JSON.stringify(namesUsed),
        );
        check(
          "an unnamed form control is named by what kind of control it is",
          !!findByName(namesDoc.root, "Checkbox") &&
            !!findByName(formDoc.root, "Select"),
          JSON.stringify(namesUsed),
        );
        // The negative half, in its own file so the check above can insist that
        // nothing at all is left called "Frame". This row is three separate
        // components at uneven gaps, so no auto-layout is inferred and the
        // naming rules run all the way down. "Frame" at least does not lie;
        // "My Searches Set Alert Clear" would.
        const glueHtml = await (await fetch("frame-names-negative.html")).text();
        const glueDoc = await window.extractDocument(glueHtml, "Glue", {
          viewportWidth: 400,
        });
        const glueNames = [];
        (function collectGlue(node) {
          if (node.kind === "FRAME") glueNames.push(node.name);
          for (const child of node.children || []) collectGlue(child);
        })(glueDoc.root);
        check(
          "separate components in a row are never glued into one name",
          // The unglued fallback: a box of separate things with no layout is
          // a group, Figma's own word for it.
          glueNames.includes("Group") &&
            !glueNames.some((n) => n.includes("My Searches") && n.includes("Set Alert")),
          JSON.stringify(glueNames),
        );
        check(
          "an authored class still outranks every rule below it",
          namesUsed.filter((n) => n === "Rule Row").length === 2 &&
            !!findByName(namesDoc.root, "Check Row"),
          JSON.stringify(namesUsed),
        );

        // --- The host page: isolation, token CSS, asset inlining ---------------
        // Everything below measures the PANEL as part of the system under test.
        // It is the page the document gets mounted into (mountDocument renders
        // into the plugin's own document, because a nested iframe would have an
        // opaque origin and be unreadable), and its stylesheet, its token-CSS
        // collection and its asset inlining all decide what the extractor ends
        // up measuring. Three defects lived here undetected while both suites
        // were at 100%, because no test had the panel in the page at all.
        await runHostChecks();

        // --- Report ------------------------------------------------------------
        const passed = results.filter((r) => r.ok).length;
        document.getElementById("results").innerHTML =
          `<h2>${passed}/${results.length} passed</h2>` +
          results
            .map(
              (r) =>
                `<div class="${r.ok ? "pass" : "fail"}">${r.ok ? "PASS" : "FAIL"} — ${r.name}${r.detail ? ` <span style="opacity:.6">(${r.detail})</span>` : ""}</div>`,
            )
            .join("");
        document.getElementById("tree").textContent = outline(doc.root);

        console.log(`HARNESS ${passed}/${results.length} passed`);
        for (const r of results) {
          if (!r.ok) console.log(`HARNESS FAIL: ${r.name} :: ${r.detail}`);
        }

        // --- Capture IR to disk (test/e2e/serve.py) ---------------------------
        await capture("fixture-screen", doc);
        await capture("orphaned-screen", orphanDoc);
        await capture("scoped-surface", scopedDoc);

        console.log("HARNESS DONE");
      }

      // -----------------------------------------------------------------
      // The host page: ui.template.html's stylesheet, and the two things
      // src/ui/main.ts hands the extractor before it measures anything (the
      // export's token CSS, and its inlined assets).
      //
      // Both are fetched, never copied. A second copy of the panel's stylesheet
      // in this file would keep passing after the real one changed, which is
      // the failure mode these checks exist to end.
      // -----------------------------------------------------------------
      async function runHostChecks() {
        const templateText = await (await fetch("/ui.template.html")).text();
        const template = new DOMParser().parseFromString(templateText, "text/html");
        const panelCss = template.querySelector("head style").textContent;

        // A DIRECT child of <body>, which is where ui.template.html puts the
        // shell and what its `body > #cd2f-app` scoping keys off: the mount
        // container is a child of <body> too, so a document's own elements are
        // always at least its grandchildren and can never match.
        document.body.appendChild(
          document.importNode(template.getElementById("cd2f-app"), true),
        );
        // src/ui/main.ts wires itself to that markup at module scope, so it can
        // only be imported once the markup is in the page. test/entry.ts
        // exposes it as a lazy dynamic import for exactly this.
        const panel = await window.loadPanel();

        // The same project the way a user brings it: as a .zip dropped on the
        // panel, unpacked and collected by the panel's own code, not by hand.
        {
          const zipBlob = await (await fetch("anim-mini.zip")).blob();
          const unzipped = await window.readZip(new File([zipBlob], "anim-mini.zip"));
          const panelForZip = panel;
          const page = unzipped.find((f) => f.name.endsWith(".html"));
          const sources = await panelForZip.collectModuleSources(unzipped.filter((f) => f !== page));
          const fromZip = await window.extractAnimationScenes(await page.text(), "Mini", {
            viewportWidth: 1440,
            moduleSources: sources,
          });
          check(
            "an animation dropped as a .zip goes through the panel's own unpacking and still yields every scene",
            fromZip.docs.length === 3 && !!sources?.["mini-engine.jsx"],
            `docs=${fromZip.docs.length} sources=${Object.keys(sources ?? {})}`,
          );
        }


        const flatten = (node, out = []) => {
          out.push(node);
          for (const child of node.children || []) flatten(child, out);
          return out;
        };
        const hexOf = (color) => {
          if (!color) return undefined;
          const toHex = (n) =>
            Math.round(Math.max(0, Math.min(1, n)) * 255)
              .toString(16)
              .padStart(2, "0");
          return `#${toHex(color.r)}${toHex(color.g)}${toHex(color.b)}`.toUpperCase();
        };
        const textNode = (root, characters) =>
          flatten(root).find(
            (n) => n.kind === "TEXT" && n.text?.characters?.trim() === characters,
          );

        // --- Direction 1: the panel's stylesheet must not reach the document ---
        const isoHtml = await (await fetch("host-isolation.html")).text();
        const clean = await window.extractDocument(isoHtml, "Iso", { viewportWidth: 400 });

        const panelStyle = document.createElement("style");
        panelStyle.textContent = panelCss;
        document.head.appendChild(panelStyle);
        const underPanel = await window.extractDocument(isoHtml, "Iso", {
          viewportWidth: 400,
        });

        const cleanNodes = flatten(clean.root);
        const panelNodes = flatten(underPanel.root);
        let firstDiff = "identical";
        for (let i = 0; i < Math.min(cleanNodes.length, panelNodes.length); i++) {
          if (JSON.stringify(cleanNodes[i]) === JSON.stringify(panelNodes[i])) continue;
          const a = cleanNodes[i];
          const b = panelNodes[i];
          firstDiff =
            `node ${i} "${a.name}": ${Math.round(a.width)}x${Math.round(a.height)}` +
            ` -> "${b.name}" ${Math.round(b.width)}x${Math.round(b.height)}`;
          break;
        }
        check(
          "a document using the panel's own class names extracts identically with the panel's stylesheet in the page",
          JSON.stringify(clean) === JSON.stringify(underPanel),
          firstDiff,
        );

        // Named separately from the deep comparison above so a regression says
        // WHICH structure went: this is the shape the real export lost, a
        // header that sets its flex properties inline but never sets `display`
        // and so stacks until someone else's `.cd2f-header { display: flex }`
        // turns it into a row.
        const header = findByName(underPanel.root, "Header");
        check(
          "the imported header keeps the two stacked lines it authored",
          header && Math.round(header.height) === 76,
          header ? `${Math.round(header.width)}x${Math.round(header.height)}` : "no Header node",
        );
        // The run's own size, not the box: the panel's `.cd2f-title` also
        // declares a line-height, but without !important, so an inline
        // line-height survives it and the BOX stays the same height while the
        // type inside it is forced from 30px to 11px.
        const title = textNode(underPanel.root, "Portage");
        check(
          "an authored font size survives the panel's !important type ramp",
          title?.text?.runs?.[0]?.fontSize === 30,
          `${title?.text?.runs?.[0]?.fontSize}px, box ${Math.round(title?.height ?? 0)} tall`,
        );
        const tokenColour = findByName(underPanel.root, "Token colour");
        check(
          "the panel's theme variables do not leak into a document that reads the same names",
          hexOf(tokenColour?.fills?.[0]?.color) === "#FF00FF",
          hexOf(tokenColour?.fills?.[0]?.color),
        );

        // --- Direction 2: a document's stylesheet must not reach the panel ----
        // Adopted into <head> exactly as `mountDocument` adopts it, and left
        // there for the same window of time: for the length of an extraction a
        // stranger's rules are live on the panel's own markup.
        const hostileText = await (await fetch("host-hostile.html")).text();
        const hostileStyle = document.createElement("style");
        hostileStyle.textContent = new DOMParser()
          .parseFromString(hostileText, "text/html")
          .querySelector("head style").textContent;
        document.head.appendChild(hostileStyle);

        const shellStyle = getComputedStyle(document.getElementById("cd2f-app"));
        const headerStyle = getComputedStyle(
          document.querySelector("#cd2f-app .cd2f-header"),
        );
        const titleStyle = getComputedStyle(document.querySelector("#cd2f-app .cd2f-title"));
        check(
          "an imported document's stylesheet cannot restyle the panel",
          headerStyle.display === "flex" &&
            headerStyle.paddingTop === "13px" &&
            titleStyle.fontSize === "12px" &&
            shellStyle.overflow === "hidden",
          `header ${headerStyle.display} pad ${headerStyle.paddingTop}, ` +
            `title ${titleStyle.fontSize}, shell overflow ${shellStyle.overflow}`,
        );
        hostileStyle.remove();
        panelStyle.remove();

        // --- The export's own token CSS (collectDsTokenCss) -------------------
        // Built as a drop: `File`s carrying the relative paths a folder pick or
        // a zip expansion would give them, which is what main.ts keys off.
        const isoFiles = await isoExportFiles();
        const tokens = await panel.collectDsTokenCss(isoFiles);
        check(
          "a token file reaches extraction as custom properties and nothing else",
          /--iso-pad:\s*12px/.test(tokens.css) &&
            /--iso-alt/.test(tokens.css) &&
            !/line-height/.test(tokens.css) &&
            !/font-size/.test(tokens.css) &&
            !/iso-card/.test(tokens.css) &&
            !/@font-face/.test(tokens.css),
          JSON.stringify(tokens.css),
        );

        const panelFile = isoFiles.find((f) => f.name === "panel.dc.html");
        const isoDocHtml = await panel.inlinedDocument(panelFile, isoFiles);
        const withTokens = await window.extractDocument(isoDocHtml, "Iso panel", {
          viewportWidth: 700,
          extraCss: tokens.css,
        });
        const withoutTokens = await window.extractDocument(isoDocHtml, "Iso panel", {
          viewportWidth: 700,
        });

        const card = (doc) => findByName(doc.root, "Card");
        check(
          "an ordinary rule in a token file does not move the layout",
          Math.round(card(withTokens).height) === 60 &&
            Math.round(card(withTokens).height) === Math.round(card(withoutTokens).height),
          `${Math.round(card(withTokens).height)} with tokens, ` +
            `${Math.round(card(withoutTokens).height)} without`,
        );
        const plain = (doc) => textNode(doc.root, "Plain");
        check(
          "text the document did not style is not restyled by the token file either",
          Math.round(plain(withTokens).height) === Math.round(plain(withoutTokens).height),
          `${Math.round(plain(withTokens).height)} with tokens, ` +
            `${Math.round(plain(withoutTokens).height)} without`,
        );
        const varBox = (doc) => findByName(doc.root, "Var box");
        check(
          "the custom properties in that same file still reach the document",
          Math.round(varBox(withTokens).height) === 44 &&
            Math.round(varBox(withoutTokens).height) === 20,
          `${Math.round(varBox(withTokens).height)} with tokens, ` +
            `${Math.round(varBox(withoutTokens).height)} without`,
        );
        const isoTokens = withTokens.designSystem?.tokens ?? [];
        const isoByName = new Map(isoTokens.map((t) => [t.name, t]));
        check(
          "the design system's tokens are all still discovered",
          isoByName.get("iso-ink")?.resolved?.toUpperCase() === "#1B6F58" &&
            isoByName.get("iso-pad")?.float === 12 &&
            isoByName.get("iso-gap")?.float === 8 &&
            isoByName.get("iso-alt")?.resolved?.toUpperCase() === "#654321",
          JSON.stringify(isoTokens.map((t) => `${t.name}=${t.resolved ?? t.float}`)),
        );

        // --- url() inside an inlined stylesheet (inlineAssets) ----------------
        // The sample string is ten characters at 20px in a shrink-to-fit box,
        // and the design system's font advances one em per glyph: 200px is the
        // right file, 100px is the decoy that a document-relative resolution
        // would have found instead, and anything else is a fallback family
        // because no face loaded at all.
        const sample = textNode(withTokens.root, "ABCDEFGHIJ");
        // The same document with the sheet stripped back out, so the 200 above
        // is known to be the face's doing and not the box's: 200px has to be
        // unreachable without it.
        const noFontHtml = isoDocHtml.replace(/data:text\/css;base64,[^"']+/, "");
        const noFont = await window.extractDocument(noFontHtml, "Iso panel", {
          viewportWidth: 700,
        });
        const fallback = textNode(noFont.root, "ABCDEFGHIJ");
        check(
          "a stylesheet's url() is inlined, and resolved against the stylesheet rather than the document",
          sample &&
            Math.round(sample.width) === 200 &&
            fallback &&
            Math.round(fallback.width) !== 200,
          `${Math.round(sample?.width ?? 0)}px with the face, ` +
            `${Math.round(fallback?.width ?? 0)}px without it`,
        );
        const inlinedCss = await (await fetch(
          isoDocHtml.match(/href="(data:text\/css;base64,[^"]+)"/)[1],
        )).text();
        check(
          "every url() in the sheet is rewritten, and an absolute one is left alone",
          (inlinedCss.match(/url\("data:font\/ttf;base64,/g) || []).length === 2 &&
            !/url\(\s*["']?\.\./.test(inlinedCss) &&
            inlinedCss.includes("https://example.invalid/iso-text.woff2"),
          JSON.stringify(inlinedCss.replace(/base64,[^"]+/g, "base64,…")),
        );
        // Read here rather than at the end: the decoy document below inlines
        // the other font on purpose, and this is the count for the two
        // documents that share the design system's sheet.
        check(
          "the font is read and base64'd once for the whole drop, and the decoy not at all",
          isoFontReads.system === 1 && isoFontReads.decoy === 0,
          `system ${isoFontReads.system}, decoy ${isoFontReads.decoy}`,
        );

        // The other half of the same rule. A sheet sitting beside the document
        // names fonts/iso-text.ttf, which is the narrow one, and has to get it:
        // "resolved against the stylesheet" is only meaningful if two sheets in
        // two places can name two different files and each gets the one it
        // named.
        const decoyFile = isoFiles.find((f) => f.name === "decoy.dc.html");
        const decoyHtml = await panel.inlinedDocument(decoyFile, isoFiles);
        const decoyDoc = await window.extractDocument(decoyHtml, "Iso decoy", {
          viewportWidth: 700,
        });
        const decoySample = textNode(decoyDoc.root, "ABCDEFGHIJ");
        check(
          "a url() naming the file beside the document gets that file, not the design system's",
          decoySample && Math.round(decoySample.width) === 100,
          decoySample ? `${Math.round(decoySample.width)}px wide` : "no sample text node",
        );

        await runNamingChecks(panel);
      }

      /**
       * Where the design system's NAME comes from.
       *
       * Against the real src/ui/main.ts, booted above, and against a real
       * inlining pass, because that is the whole bug. `inferSystemName`
       * (src/ui/extract.ts) reads the `_ds/<name>-<uuid>/` folder out of a
       * stylesheet href, and by the time it runs `inlineAssets` has rewritten
       * every href into a data: URI. It falls through to the SCREEN's name, and
       * two screens of one export then asked for two Figma variable collections
       * holding the same variables.
       *
       * A hand-built IRDocument cannot catch a regression here: the name is
       * decided in the panel, from the dropped File list and the manifest, and
       * neither reaches the extractor. So this drives the panel.
       */
      async function runNamingChecks(panel) {
        // Asserted rather than assumed, and returned from rather than thrown
        // through: `runHostChecks` runs before the report is written, so a
        // TypeError here would cost the whole run its tally instead of one
        // named failure.
        const exported =
          typeof panel.designSystemName === "function" &&
          typeof panel.nameDesignSystems === "function";
        check(
          "the panel exposes the two functions that decide the design system's name",
          exported,
          `designSystemName=${typeof panel.designSystemName} nameDesignSystems=${typeof panel.nameDesignSystems}`,
        );
        if (!exported) return;

        const DS = "_ds/acme-design-system-3f2a9c1e-7b4d-4e8a-9c21-5d6e7f8a9b0c";
        const paths = [
          "Screen One.dc.html",
          "Screen Two.dc.html",
          `${DS}/tokens/colors.css`,
          `${DS}/_ds_manifest.json`,
        ];
        const files = [];
        for (const path of paths) {
          const bytes = await (await fetch(`ds-export/${encodeURI(path)}`)).arrayBuffer();
          const file = new File([bytes], path.split("/").pop());
          Object.defineProperty(file, "webkitRelativePath", {
            value: `ds-export/${path}`,
          });
          files.push(file);
        }
        const manifest = await files[3].text();
        const tokens = await panel.collectDsTokenCss(files);

        // The premise, asserted rather than assumed: after inlining there is no
        // `_ds/` path left in the markup for anything downstream to read.
        const oneHtml = await panel.inlinedDocument(files[0], files);
        check(
          "inlining leaves no _ds path in the markup for the system name to be read from",
          oneHtml.includes("data:text/css;base64,") && !oneHtml.includes(`${DS}/tokens`),
          `data-uri=${oneHtml.includes("data:text/css;base64,")} _ds-path=${oneHtml.includes(`${DS}/tokens`)}`,
        );

        const twoHtml = await panel.inlinedDocument(files[1], files);
        const docs = [
          await window.extractDocument(oneHtml, "Screen One", {
            viewportWidth: 400,
            extraCss: tokens.css,
            dsManifest: manifest,
          }),
          await window.extractDocument(twoHtml, "Screen Two", {
            viewportWidth: 400,
            extraCss: tokens.css,
            dsManifest: manifest,
          }),
        ];
        check(
          "the extractor alone names each screen's design system after the screen",
          docs[0].designSystem?.name === "Screen One" &&
            docs[1].designSystem?.name === "Screen Two" &&
            docs[0].designSystem?.key === "AcmeDesignSystem_3f2a9c" &&
            docs[1].designSystem?.key === "AcmeDesignSystem_3f2a9c",
          `${JSON.stringify(docs.map((d) => d.designSystem?.name))} keys=${JSON.stringify(docs.map((d) => d.designSystem?.key))}`,
        );

        // The fix, on the batch the panel posts to the sandbox.
        panel.nameDesignSystems(docs, files, manifest);
        check(
          "every screen of one export carries one design-system name, taken from the _ds folder",
          docs[0].designSystem?.name === "Acme Design System" &&
            docs[1].designSystem?.name === "Acme Design System",
          JSON.stringify(docs.map((d) => d.designSystem?.name)),
        );

        // The priority order, at the boundary each rung is reached from. The
        // folder beats the namespace because "AcmeDesignSystem_3f2a9c" is a
        // stable key, not a label anybody wants in the variables panel; a
        // manifest that declares a `name` beats both because that is the
        // designer saying it outright.
        const declared = JSON.stringify({
          ...JSON.parse(manifest),
          name: "Acme, the good one",
        });
        check(
          "a name the manifest declares outright wins over the folder",
          panel.designSystemName(files, declared) === "Acme, the good one",
          JSON.stringify(panel.designSystemName(files, declared)),
        );
        check(
          "with no _ds folder the manifest's namespace is the last resort, and no export at all has no name",
          panel.designSystemName([files[0]], manifest) === "AcmeDesignSystem_3f2a9c" &&
            panel.designSystemName([files[0]], undefined) === undefined &&
            panel.designSystemName([], "{not json") === undefined,
          `${JSON.stringify(panel.designSystemName([files[0]], manifest))} / ` +
            `${JSON.stringify(panel.designSystemName([files[0]], undefined))}`,
        );

        // A document with no design system in it must not gain one. The batch
        // loop writes onto `doc.designSystem`, which is absent for a screen
        // whose export shipped no tokens at all.
        const bare = { name: "Bare", root: {}, warnings: [] };
        panel.nameDesignSystems([bare], files, manifest);
        check(
          "a screen carrying no design system is left without one",
          bare.designSystem === undefined,
          JSON.stringify(bare.designSystem ?? null),
        );
      }

      /**
       * The iso-export fixture as a `File[]`, shaped like a real drop.
       *
       * `webkitRelativePath` is a read-only getter on File.prototype, so it is
       * defined on the instance, exactly as src/ui/zip.ts does it for a zip
       * entry. `collectDsTokenCss` and `inlineAssets` both key off it.
       *
       * The two font files are counted as they are read, which is how the memo
       * that keeps a 2.6 MB export from being base64'd once per screen gets
       * asserted, and how "the decoy was never touched" gets said in numbers.
       */
      const isoFontReads = { system: 0, decoy: 0 };

      async function isoExportFiles() {
        const paths = [
          "panel.dc.html",
          "board.dc.html",
          "decoy.dc.html",
          "decoy.css",
          "_ds/iso-design-system-0000/tokens/fonts.css",
          "_ds/iso-design-system-0000/tokens/tokens.css",
          "_ds/iso-design-system-0000/fonts/iso-text.ttf",
          "fonts/iso-text.ttf",
        ];
        const files = [];
        for (const path of paths) {
          const bytes = await (await fetch(`iso-export/${path}`)).arrayBuffer();
          const file = new File([bytes], path.split("/").pop());
          Object.defineProperty(file, "webkitRelativePath", {
            value: `iso-export/${path}`,
          });
          if (path.endsWith(".ttf")) {
            const which = path.includes("_ds") ? "system" : "decoy";
            const read = file.arrayBuffer.bind(file);
            file.arrayBuffer = () => {
              isoFontReads[which] += 1;
              return read();
            };
          }
          files.push(file);
        }
        // Both documents link the same stylesheet, so inlining both is what
        // proves the font behind it is encoded once rather than once per
        // screen. Done here so the count is settled before anything reads it.
        await window.loadPanel().then(async (panel) => {
          await panel.inlinedDocument(files[0], files);
          await panel.inlinedDocument(files[1], files);
        });
        return files;
      }
    </script>
  </body>
</html>
