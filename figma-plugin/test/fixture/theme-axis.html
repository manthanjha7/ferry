<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Document-declared theme axis fixture</title>
    <style>
      /* The shape that produced the bug: a document whose ENTIRE theme is two
         class-scoped blocks and which has no :root block at all. Read as
         literals, every themed fill in the document imports as raw hex, which
         is what a user saw after a build reported 182 new variables and bound
         none of them to the panel's text.

         Modelled on `Portage Panel.dc.html`, which declares fifteen
         `--figma-color-*` properties under `.cd2f-theme-light` and the same
         fifteen with different values under `.cd2f-theme-dark`. The real export
         is not committed here: it references an internal design system and this
         repo is headed for public. */
      .dv-theme-light {
        --dv-surface: #ffffff;
        --dv-text: #1e1e1e;
        --dv-muted: #b3b3b3;
        --dv-border: #e6e6e6;
      }
      .dv-theme-dark {
        --dv-surface: #2c2c2c;
        --dv-text: #ffffff;
        --dv-muted: #7e7e7e;
        --dv-border: #444444;
      }

      /* Three negative controls, one per reason a scoped block is not a theme.

         A lone block: enough properties to be considered, but nothing else
         declares the same names, so there is no second value for a mode to
         hold and "Badge" as a mode would be nonsense. */
      .dv-badge {
        --dv-badge-bg: #0d99ff;
        --dv-badge-fg: #ffffff;
        --dv-badge-radius: 4px;
      }

      /* A pair sharing ONE name with different values: a component variant, not
         a theme. A theme re-declares a set (this export's is fifteen names
         wide); a variant flips one. Modes named "Ok" and "Bad" on a colour
         collection would be the cost of getting this wrong. */
      .dv-chip-ok {
        --dv-chip-bg: #00794b;
      }
      .dv-chip-bad {
        --dv-chip-bg: #c8331a;
      }

      /* A pair sharing every name AND every value: two selectors for one look,
         which is an alias rather than an axis. A second mode here could never
         differ from the first.

         Deliberately FIVE names, one more than the light/dark pair above, so it
         outranks the real theme on shared-name count. Rejecting a non-differing
         group only at the end lets this win the race and then take detection
         down with it, and the document loses the theme it does have. */
      .dv-alias-a {
        --dv-alias-bg: #f5f5f5;
        --dv-alias-fg: #1e1e1e;
        --dv-alias-line: #e6e6e6;
        --dv-alias-accent: #0d99ff;
        --dv-alias-shade: #767676;
      }
      .dv-alias-b {
        --dv-alias-bg: #f5f5f5;
        --dv-alias-fg: #1e1e1e;
        --dv-alias-line: #e6e6e6;
        --dv-alias-accent: #0d99ff;
        --dv-alias-shade: #767676;
      }
    </style>
  </head>
  <body style="margin: 0">
    <div class="dv-theme-light" data-name="Light root" style="width: 200px">
      <div
        data-name="Light panel"
        style="width: 200px; height: 80px; background: var(--dv-surface); border: 1px solid var(--dv-border)"
      >
        <p data-name="Light label" style="margin: 0; color: var(--dv-muted)">Light muted</p>
        <!-- No var(): the colour arrives as a literal and can only be matched
             by value, which is the path that needs a per-theme colour index. -->
        <div data-name="Light swatch" style="width: 20px; height: 20px; background: #b3b3b3"></div>
      </div>
    </div>

    <div class="dv-theme-dark" data-name="Dark root" style="width: 200px">
      <div
        data-name="Dark panel"
        style="width: 200px; height: 80px; background: var(--dv-surface); border: 1px solid var(--dv-border)"
      >
        <p data-name="Dark label" style="margin: 0; color: var(--dv-muted)">Dark muted</p>
        <div data-name="Dark swatch" style="width: 20px; height: 20px; background: #7e7e7e"></div>
      </div>
    </div>

    <!-- Outside every theme. #7e7e7e is dark's `--dv-muted` and the base layer
         holds light's #b3b3b3, so a token here would mean a theme's value had
         leaked into the base index. -->
    <div data-name="Unthemed swatch" style="width: 20px; height: 20px; background: #7e7e7e"></div>

    <div class="dv-badge" data-name="Badge" style="width: 200px">
      <div
        data-name="Badge fill"
        style="width: 60px; height: 20px; background: var(--dv-badge-bg)"
      ></div>
    </div>
  </body>
</html>
