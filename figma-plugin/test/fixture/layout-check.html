<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Layout checks from real-Figma runs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      body { margin: 0; font: 14px/20px sans-serif; }
      .bar { display: flex; align-items: center; gap: 8px; width: 600px; padding: 0 16px; height: 40px; background: #eee; }
      .push { margin-left: auto; }
      .even { display: flex; justify-content: space-evenly; width: 600px; }
      .even span { width: 60px; height: 20px; background: #0cf; }
      .card { position: relative; display: flex; gap: 8px; width: 300px; padding: 8px; background: #fafafa; }
      .badge { position: absolute; top: -6px; right: -6px; width: 12px; height: 12px; background: red; border-radius: 50%; }
      .nav { display: flex; flex-direction: column; width: 200px; }
      .item { display: flex; align-items: center; gap: 10px; }
      .icon { width: 16px; text-align: center; }
      .centred { width: 400px; text-align: center; }
      .mixed { width: 900px; font-size: 72px; line-height: 1.085; margin: 0; }
      .mixed em { font-family: Georgia, serif; }
      .arrowlink span { display: inline-block; }
    </style>
  </head>
  <body>
    <div data-name="Tab bar" class="bar"><span>This week</span><span>Project</span><span data-name="Date" class="push">Fri 23 Oct</span></div>
    <div data-name="Even row" class="even"><span></span><span></span><span></span></div>
    <div data-name="Card" class="card"><span>Leads</span><span>41</span><i data-name="Badge" class="badge"></i></div>
    <div data-name="Nav" class="nav"><div data-name="Nav item" class="item"><span class="icon">◧</span><span>This week</span></div></div>
    <p data-name="Centred" class="centred">Centred copy</p>
    <h1 data-name="Mixed" class="mixed">I turn messy problems into <em>useful</em> products.</h1>
    <a data-name="Arrow link" class="arrowlink">Explore my work <span>↓</span></a>
    <div data-name="Accent card" style="width: 200px; height: 40px; border: 1px solid rgb(200, 200, 200); border-left: 4px solid rgb(201, 162, 74); border-radius: 5px; overflow: hidden"></div>
    <div data-name="Top accent" style="width: 200px; height: 40px; border: 1px solid rgb(200, 200, 200); border-top: 3px solid rgb(255, 0, 0)"></div>
    <div data-name="Inline dressing" style="width: 400px">+ 9 more · <a href="#all" style="text-decoration: none; border-bottom: 2px solid rgb(122, 31, 46)">show all</a> · Ashok Pal <span style="opacity: 0.5">loan</span></div>
    <p style="width: 180px; margin: 0; font: 16px/0.9 Georgia, serif">Tight leading wraps onto three lines without its boxes looking like one</p>
    <div data-name="Tilted card" style="width:120px;height:150px;background:#e7e1d6;rotate:1.4deg"></div>
    <div style="width:200px;height:120px"><image-slot id="hero" shape="rect" placeholder="Drop your hero photo"></image-slot></div>
    <p data-name="Logo">mj<span style="color:#3d3df5">✳</span></p>
    <span data-name="Round button" style="width:40px;height:40px;display:grid;place-items:center;border:1px solid #999;border-radius:50%;font-size:17px">↑</span>
    <div style="display:flex;align-items:baseline;gap:12px"><span data-name="Score" style="font:700 46px/1 sans-serif">3<span style="font-size:26px">/10</span></span><span>behind pace</span></div>
  </body>
</html>
