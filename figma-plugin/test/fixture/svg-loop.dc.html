<!DOCTYPE html>
<html>
  <head><meta charset="utf-8" /></head>
  <body>
    <x-dc>
      <!-- A chart built by loops inside an <svg>, the way Claude Design writes
           dashboards. Inside svg the parser makes <template> an SVG element,
           and a case-sensitive tag check left every loop unexpanded. -->
      <svg data-name="Chart" viewBox="0 0 200 100" width="200" height="100">
        <sc-for list="{{ dots }}" as="d">
          <circle cx="{{ d.x }}" cy="50" r="4" fill="#7a1f2e"></circle>
        </sc-for>
      </svg>
    </x-dc>
    <script type="text/x-dc" data-dc-script>
      class Component extends DCLogic {
        renderVals() {
          return { dots: [{ x: 20 }, { x: 60 }, { x: 100 }, { x: 140 }] };
        }
      }
    </script>
  </body>
</html>
