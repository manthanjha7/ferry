<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Attribute theme pair fixture</title>
    <style>
      /* No base layer at all: two attribute themes that are the whole theme. */
      [data-look="paper"] {
        --lk-bg: #fbf9f5;
        --lk-fg: #14120f;
        --lk-rule: #e7e1d6;
      }
      [data-look="ink"] {
        --lk-bg: #14120f;
        --lk-fg: #fbf9f5;
        --lk-rule: #3a362e;
      }
    </style>
  </head>
  <body>
    <div data-name="Pair page" style="width: 200px; height: 40px; background: var(--lk-bg, #ff00ff)"></div>
  </body>
</html>
