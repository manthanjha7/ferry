<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      Synthetic fixture for layer naming.

      Every block below is a shape that used to fall through to the literal
      name "Frame", copied in structure from the ones that actually did so in
      the Portage export: a painted hairline separator, an empty grid cell
      holding a column open, a caption too long for the old 40-character cap,
      and a line of prose split across inline spans with a display:none span
      among them.

      The last two blocks are the negative half. A row of separate components
      must NOT have their labels glued into one name, and an element the author
      gave a class keeps that class's name.
    -->
    <style>
      body {
        margin: 0;
        background: #ffffff;
        font: 12px/1.5 Helvetica, Arial, sans-serif;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        width: 360px;
      }
      .rule-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .check-row {
        display: grid;
        grid-template-columns: 13px 1fr;
        column-gap: 9px;
        row-gap: 3px;
        align-items: start;
      }
      .caption {
        padding: 6px;
        background: #f5f5f5;
        font-size: 10px;
        line-height: 14px;
      }
      .status-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        background: #eeeeee;
      }
    </style>
  </head>
  <body>
    <div class="stack">
      <!-- A painted hairline: a separator, and nothing else in the world. -->
      <div class="rule-row">
        <span style="font-size: 11px">Section</span>
        <div style="flex: 1 1 auto; height: 1px; background: #e6e6e6"></div>
      </div>

      <!-- An empty grid cell, holding the second row's label under the first,
           and an unnamed checkbox beside it. -->
      <label class="check-row">
        <input type="checkbox" checked style="width: 13px; height: 13px; margin: 0" />
        <span style="font-size: 11px">Create variables for unmatched tokens</span>
        <div></div>
        <span style="font-size: 10px; color: #b3b3b3">Anything uncovered lands here</span>
      </label>

      <!-- 97 characters of caption: over the old 40-character cap, and no class
           to be named from either. -->
      <div style="padding: 6px; background: #f5f5f5; font-size: 10px; line-height: 14px">
        Only needed when the document doesn't link its own _ds tokens, which
        exported decks usually don't.
      </div>

      <!-- One line of prose across inline spans, one of them display:none, with
           the newline after the first span that makes the gaps uneven and so
           leaves the box absolute rather than an inferred stack. Copied from
           the export, whitespace included, because the whitespace is load
           bearing. -->
      <div class="status-row">
        <div style="flex: 0 0 92px; font-size: 11px">Design system CSS</div>
        <div style="flex: 1 1 auto; min-width: 0; font-size: 11px; line-height: 16px">
          <span style="font-weight: 500">none</span>
          <span style="color: #b3b3b3"> · </span><span style="color: #0d99ff">add token files</span><span style="display: none"><span> · </span><span>forget</span></span>
        </div>
      </div>

      <!-- Visible copy with a display:none sibling holding more text. This one
           is named by the rule that was already there, so it proves names come
           from what is on the canvas rather than from textContent. -->
      <div style="font-size: 11px">Saved<span style="display: none">unsaved</span></div>

      <!-- Authored intent through role, which is not aria-label. -->
      <div role="tablist" style="display: flex; gap: 6px">
        <span style="font-size: 11px">Light</span>
        <span style="font-size: 11px">Dark</span>
      </div>

      <!-- The negative case: separate components, never one glued name. -->
      <div style="display: flex; gap: 6px">
        <button class="pill">My Searches</button>
        <button class="pill">Set Alert</button>
      </div>

      <!-- An authored class still outranks everything below it. -->
      <div class="rule-row">
        <div style="flex: 1 1 auto; height: 1px; background: #e6e6e6"></div>
      </div>
    </div>
  </body>
</html>
