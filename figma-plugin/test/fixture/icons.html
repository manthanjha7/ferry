<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
body { margin: 0; font-family: Inter, sans-serif; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; }
.nav { display: flex; gap: 24px; padding: 24px; }
.item { display: flex; align-items: center; gap: 8px; color: #1f1f1f; font-size: 15px; }
.hero { padding: 24px; }
.big { font-size: 48px; color: #3d3df5; }
</style></head>
<body>
<div class="nav" data-name="Nav">
  <div class="item"><span class="material-symbols-outlined">home</span>Home</div>
  <div class="item"><span class="material-symbols-outlined">search</span>Search</div>
  <div class="item"><span class="material-symbols-outlined">settings</span>Settings</div>
  <div class="item"><span class="material-symbols-outlined">arrow_forward</span>Next</div>
</div>
<div class="hero"><span class="material-symbols-outlined big" data-name="Big icon">favorite</span></div>
</body></html>
