<!doctype html>
<!--
  A fixed-size box wraps its glyph without hugging it. `.iconbox` is a 24x24
  square that centres a single "P", exactly like the 16px Portage logo that
  imported as an 8px bar in every one of the 14 panels once the chip/badge
  heuristic hugged it onto its text. It must stay FIXED at its declared size.

  `.chip` is the negative control: its width IS its label plus padding, so it
  sits tight against its text and must still hug, or a wider substituted font
  would wrap the label inside its own pill. See the hugContent decision in
  src/ui/extract.ts.
-->
<meta charset="utf-8" />
<style>
  body { margin: 0; font-family: Inter, -apple-system, sans-serif; }
  .row { display: flex; align-items: flex-start; gap: 8px; padding: 16px; }
  .iconbox {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: #0d99ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 999px;
    background: #e2f4ec;
    font-size: 12px;
    color: #1b6f58;
  }
</style>
<body>
  <div class="row">
    <div class="iconbox">P</div>
    <div class="chip">Active</div>
  </div>
</body>
